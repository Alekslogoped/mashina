<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Машинка на дороге</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #eef6ff;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game {
      position: relative;
      width: min(1200px, 100vw);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #9bd486;
    }

    /* =========================
       HUD
    ========================= */

    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;

      display: flex;
      justify-content: space-between;

      z-index: 100;
      pointer-events: none;
    }

    .panel {
      background: rgba(255,255,255,.92);
      padding: 9px 15px;
      border-radius: 20px;

      font-weight: bold;
      font-size: 18px;

      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }

    #hint {
      position: absolute;
      left: 50%;
      top: 65px;
      transform: translateX(-50%);

      z-index: 100;

      background: rgba(255,255,255,.9);
      padding: 8px 16px;
      border-radius: 25px;

      font-weight: bold;
      pointer-events: none;
    }


    /* =========================
       МИР
    ========================= */

    #world {
      position: absolute;
      left: 0;
      top: 0;

      width: 6200px;
      height: 100%;

      transform: translateX(0);
    }


    /* =========================
       ФОН
    ========================= */

    #background {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          #bfe9ff 0%,
          #bfe9ff 43%,
          #91d27d 43%,
          #91d27d 100%
        );
    }


    /* =========================
       ДОРОГА
    ========================= */

    #road {
      position: absolute;

      left: 0;
      top: 48%;

      width: 100%;
      height: 42%;

      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 130px,
          rgba(255,255,255,.95) 130px 200px,
          transparent 200px 330px
        ),
        #666;

      border-top: 10px solid #fff;
      border-bottom: 10px solid #fff;
    }


    /* =========================
       СЕКЦИИ
    ========================= */

    .section-marker {
      position: absolute;

      top: 49%;

      width: 4px;
      height: 40%;

      background: rgba(255,255,255,.2);
    }


    /* =========================
       ПРЕДМЕТЫ
    ========================= */

    .item {
      position: absolute;

      width: 80px;
      height: 80px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 60px;

      transform: translate(-50%, -50%);

      z-index: 20;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .item.collected {
      opacity: 0;
      transform:
        translate(-50%, -50%)
        scale(1.7);
    }


    /* =========================
       ЗНАК
    ========================= */

    .sign {
      position: absolute;

      width: 90px;
      height: 110px;

      transform: translate(-50%, -50%);

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 75px;

      z-index: 15;
    }


    /* =========================
       МАШИНКА
    ========================= */

    #car {
      position: absolute;

      width: 115px;
      height: 90px;

      left: 180px;
      top: 69%;

      transform: translate(-50%, -50%);

      z-index: 50;

      display: flex;
      justify-content: center;
      align-items: center;

      pointer-events: none;
    }

    #carVisual {
      font-size: 92px;
      line-height: 1;

      transform-origin: center;

      filter:
        drop-shadow(
          0 8px 5px
          rgba(0,0,0,.25)
        );
    }


    /* =========================
       OVERLAY
    ========================= */

    .overlay {
      position: absolute;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(0,0,0,.28);

      z-index: 200;
    }

    .card {
      background: white;

      padding: 28px 38px;

      border-radius: 25px;

      text-align: center;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.25);
    }

    .card h1 {
      margin: 0 0 10px;
    }

    button {
      margin-top: 15px;

      border: none;
      border-radius: 999px;

      padding: 14px 30px;

      background: #2f80ed;
      color: white;

      font-size: 19px;
      font-weight: bold;

      cursor: pointer;
    }

    #finish {
      display: none;
    }

  </style>
</head>

<body>

<div id="game">

  <div id="hud">

    <div class="panel">
      Собрано:
      <span id="score">0</span>/25
    </div>

    <div class="panel">
      Участок:
      <span id="section">1</span>/5
    </div>

  </div>


  <div id="hint">
    ← назад · → вперёд · ↑ ↓ по дороге
  </div>


  <!-- =========================
       МИР
  ========================= -->

  <div id="world">

    <div id="background"></div>

    <div id="road"></div>

    <div id="objectsLayer"></div>

  </div>


  <!-- =========================
       МАШИНКА
  ========================= -->

  <div id="car">

    <div id="carVisual">
      🚗
    </div>

  </div>


  <!-- =========================
       СТАРТ
  ========================= -->

  <div id="startOverlay" class="overlay">

    <div class="card">

      <h1>Поехали!</h1>

      <div>
        Управляй машинкой стрелками.
      </div>

      <button id="startBtn">
        СТАРТ
      </button>

    </div>

  </div>


  <!-- =========================
       ФИНИШ
  ========================= -->

  <div id="finish" class="overlay">

    <div class="card">

      <h1>Молодец!</h1>

      <div>
        Ты проехал всю дорогу!
      </div>

      <button id="restartBtn">
        Играть ещё
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   ЭЛЕМЕНТЫ
========================= */

const game =
  document.getElementById("game");

const world =
  document.getElementById("world");

const car =
  document.getElementById("car");

const carVisual =
  document.getElementById("carVisual");

const objectsLayer =
  document.getElementById("objectsLayer");

const scoreElement =
  document.getElementById("score");

const sectionElement =
  document.getElementById("section");

const startOverlay =
  document.getElementById("startOverlay");

const finish =
  document.getElementById("finish");

const startBtn =
  document.getElementById("startBtn");

const restartBtn =
  document.getElementById("restartBtn");


/* =========================
   НАСТРОЙКИ МИРА
========================= */

const WORLD_WIDTH = 6200;

const TOTAL_SECTIONS = 5;

const SECTION_WIDTH =
  WORLD_WIDTH / TOTAL_SECTIONS;

const ITEMS_PER_SECTION = 5;


/*
Скорость машины
*/

const SPEED_X = 6;
const SPEED_Y = 4;


/* =========================
   ПОЗИЦИЯ
========================= */

/*
Мировая координата машины
*/

let carWorldX = 180;


/*
Положение машины по высоте
в процентах экрана
*/

let carY = 69;


/*
Камера
*/

let cameraX = 0;


/*
Собранные предметы
*/

let score = 0;


/*
Игра запущена?
*/

let running = false;


/* =========================
   КЛАВИШИ
========================= */

const keys = {

  ArrowLeft: false,

  ArrowRight: false,

  ArrowUp: false,

  ArrowDown: false

};


window.addEventListener(
  "keydown",
  event => {

    if (
      event.key in keys
    ) {

      event.preventDefault();

      keys[event.key] =
        true;

    }

  }
);


window.addEventListener(
  "keyup",
  event => {

    if (
      event.key in keys
    ) {

      event.preventDefault();

      keys[event.key] =
        false;

    }

  }
);


/* =========================
   25 ПРЕДМЕТОВ
========================= */

const ALL_ITEMS = [

  "🍎","🍐","🍊","🍋","🍉",

  "⚽","🏀","🎾","🧸","🎈",

  "🚂","🚲","🚁","⛵","🚜",

  "🐱","🐶","🐭","🐰","🦊",

  "⭐","🌙","☀️","🌈","☁️"

];


let itemObjects = [];


/* =========================
   СОЗДАЁМ ВСЮ ДОРОГУ
========================= */

function createWorld() {

  objectsLayer.innerHTML = "";

  itemObjects = [];


  for (
    let section = 0;
    section < TOTAL_SECTIONS;
    section++
  ) {


    const sectionStart =
      section *
      SECTION_WIDTH;


    /*
    5 предметов
    */

    const offsets = [

      260,
      460,
      660,
      860,
      1060

    ];


    const yPositions = [

      65,
      74,
      59,
      70,
      63

    ];


    for (
      let i = 0;
      i < ITEMS_PER_SECTION;
      i++
    ) {


      const index =
        section *
        ITEMS_PER_SECTION
        +
        i;


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "item";


      item.innerHTML =
        ALL_ITEMS[index];


      const worldX =
        sectionStart +
        offsets[i];


      item.style.left =
        worldX + "px";


      item.style.top =
        yPositions[i] + "%";


      objectsLayer.appendChild(
        item
      );


      itemObjects.push({

        element: item,

        worldX: worldX,

        collected: false

      });

    }


    /*
    Знак в конце участка
    */

    if (
      section <
      TOTAL_SECTIONS - 1
    ) {


      const sign =
        document.createElement(
          "div"
        );


      sign.className =
        "sign";


      sign.innerHTML =
        "🚧";


      sign.style.left =
        sectionStart +
        SECTION_WIDTH -
        80 +
        "px";


      sign.style.top =
        "60%";


      objectsLayer.appendChild(
        sign
      );

    }

  }

}


/* =========================
   ДВИЖЕНИЕ МАШИНЫ
========================= */

function moveCar() {


  if (
    keys.ArrowRight
  ) {

    carWorldX +=
      SPEED_X;


    carVisual.style.transform =
      "scaleX(1)";

  }


  if (
    keys.ArrowLeft
  ) {

    carWorldX -=
      SPEED_X;


    carVisual.style.transform =
      "scaleX(-1)";

  }


  if (
    keys.ArrowUp
  ) {

    carY -=
      SPEED_Y * 0.1;

  }


  if (
    keys.ArrowDown
  ) {

    carY +=
      SPEED_Y * 0.1;

  }


  /*
  Нельзя выйти за начало/конец
  */

  carWorldX =
    Math.max(
      70,
      Math.min(
        WORLD_WIDTH - 70,
        carWorldX
      )
    );


  /*
  Машинка остаётся
  в пределах дороги
  */

  carY =
    Math.max(
      54,
      Math.min(
        83,
        carY
      )
    );

}


/* =========================
   КАМЕРА
========================= */

function updateCamera() {


  const gameWidth =
    game.clientWidth;


  /*
  Машину стараемся держать
  примерно на 35% экрана
  */

  const desiredScreenX =
    gameWidth *
    0.35;


  cameraX =
    carWorldX -
    desiredScreenX;


  /*
  Камера не выходит
  за начало и конец мира
  */

  cameraX =
    Math.max(
      0,
      Math.min(
        WORLD_WIDTH -
        gameWidth,

        cameraX
      )
    );


  world.style.transform =
    `translateX(${-cameraX}px)`;


  /*
  экранная позиция машины
  */

  const carScreenX =
    carWorldX -
    cameraX;


  car.style.left =
    carScreenX +
    "px";


  car.style.top =
    carY +
    "%";

}


/* =========================
   ТЕКУЩИЙ УЧАСТОК
========================= */

function updateSection() {


  let section =
    Math.floor(
      carWorldX /
      SECTION_WIDTH
    )
    + 1;


  section =
    Math.max(
      1,
      Math.min(
        TOTAL_SECTIONS,
        section
      )
    );


  sectionElement.textContent =
    section;

}


/* =========================
   СБОР ПРЕДМЕТОВ
========================= */

function checkItems() {


  const carRect =
    car.getBoundingClientRect();


  itemObjects.forEach(
    item => {


      if (
        item.collected
      ) {

        return;

      }


      const itemRect =
        item.element
          .getBoundingClientRect();


      const collision = !(

        carRect.right <
        itemRect.left

        ||

        carRect.left >
        itemRect.right

        ||

        carRect.bottom <
        itemRect.top

        ||

        carRect.top >
        itemRect.bottom

      );


      if (
        collision
      ) {


        item.collected =
          true;


        item.element
          .classList
          .add(
            "collected"
          );


        score++;


        scoreElement.textContent =
          score;

      }

    }
  );

}


/* =========================
   ФИНИШ
========================= */

function checkFinish() {


  if (
    carWorldX >
    WORLD_WIDTH - 180
  ) {


    running =
      false;


    finish.style.display =
      "flex";

  }

}


/* =========================
   ЦИКЛ
========================= */

function gameLoop() {


  if (
    running
  ) {


    moveCar();

    updateCamera();

    updateSection();

    checkItems();

    checkFinish();

  }


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================
   СТАРТ
========================= */

function startGame() {


  carWorldX =
    180;


  carY =
    69;


  cameraX =
    0;


  score =
    0;


  scoreElement.textContent =
    "0";


  sectionElement.textContent =
    "1";


  finish.style.display =
    "none";


  startOverlay.style.display =
    "none";


  createWorld();


  updateCamera();


  running =
    true;

}


/* =========================
   КНОПКИ
========================= */

startBtn.addEventListener(
  "click",
  startGame
);


restartBtn.addEventListener(
  "click",
  startGame
);


/* =========================
   ПЕРВЫЙ ЗАПУСК
========================= */

createWorld();

updateCamera();

requestAnimationFrame(
  gameLoop
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Машинка собирает предметы</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #eef6ff;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

#game {
  position: relative;
  width: min(1200px, 100vw);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #dff3ff;
}

/* =========================
   ПАНЕЛЬ
========================= */

#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;

  display: flex;
  justify-content: space-between;

  z-index: 100;
  pointer-events: none;
}

.panel {
  background: rgba(255,255,255,.94);
  padding: 9px 16px;
  border-radius: 22px;
  font-weight: bold;
  font-size: 18px;
  box-shadow: 0 4px 12px rgba(0,0,0,.14);
}

#hint {
  position: absolute;
  left: 50%;
  top: 65px;
  transform: translateX(-50%);

  z-index: 100;

  background: rgba(255,255,255,.94);

  padding: 8px 16px;

  border-radius: 25px;

  font-weight: bold;
  pointer-events: none;
  white-space: nowrap;
}

/* =========================
   МИР
========================= */

#world {
  position: absolute;

  left: 0;
  top: 0;

  width: 9000px;
  height: 100%;

  transform: translateX(0);

  will-change: transform;
}

/* =========================
   ФОНЫ ДОРОГИ
========================= */

/*
1920px — ширина каждой картинки.

Но следующий фон начинается
раньше предыдущего на 150px.

То есть участки перекрываются,
и стык становится мягче.
*/

.road-section {
  position: absolute;

  top: 0;

  width: 1920px;
  height: 100%;

  background-repeat: no-repeat;

  background-position:
    center center;

  background-size:
    100% 100%;
}


/* ПЕРВЫЙ */

#road1 {
  left: 0;

  background-image:
    url("items/road-01.png");

  z-index: 1;
}


/* ВТОРОЙ */

#road2 {
  left: 1770px;

  background-image:
    url("items/road-02.png");

  z-index: 2;

  /*
  мягкое появление
  слева
  */

  -webkit-mask-image:
    linear-gradient(
      to right,
      transparent 0,
      rgba(0,0,0,.25) 40px,
      rgba(0,0,0,.65) 90px,
      black 150px
    );

  mask-image:
    linear-gradient(
      to right,
      transparent 0,
      rgba(0,0,0,.25) 40px,
      rgba(0,0,0,.65) 90px,
      black 150px
    );
}


/* ТРЕТИЙ */

#road3 {
  left: 3540px;

  background-image:
    url("items/road-03.png");

  z-index: 3;

  -webkit-mask-image:
    linear-gradient(
      to right,
      transparent 0,
      rgba(0,0,0,.25) 40px,
      rgba(0,0,0,.65) 90px,
      black 150px
    );

  mask-image:
    linear-gradient(
      to right,
      transparent 0,
      rgba(0,0,0,.25) 40px,
      rgba(0,0,0,.65) 90px,
      black 150px
    );
}


/* ЧЕТВЁРТЫЙ */

#road4 {
  left: 5310px;

  background-image:
    url("items/road-04.png");

  z-index: 4;

  -webkit-mask-image:
    linear-gradient(
      to right,
      transparent 0,
      rgba(0,0,0,.25) 40px,
      rgba(0,0,0,.65) 90px,
      black 150px
    );

  mask-image:
    linear-gradient(
      to right,
      transparent 0,
      rgba(0,0,0,.25) 40px,
      rgba(0,0,0,.65) 90px,
      black 150px
    );
}


/* ПЯТЫЙ */

#road5 {
  left: 7080px;

  background-image:
    url("items/road-05.png");

  z-index: 5;

  -webkit-mask-image:
    linear-gradient(
      to right,
      transparent 0,
      rgba(0,0,0,.25) 40px,
      rgba(0,0,0,.65) 90px,
      black 150px
    );

  mask-image:
    linear-gradient(
      to right,
      transparent 0,
      rgba(0,0,0,.25) 40px,
      rgba(0,0,0,.65) 90px,
      black 150px
    );
}


/* =========================
   ПРЕДМЕТЫ
========================= */

.item {
  position: absolute;

  width: 82px;
  height: 82px;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 60px;

  transform:
    translate(-50%, -50%);

  z-index: 30;

  transition:
    opacity .22s ease,
    transform .22s ease;
}

.item.collected {
  opacity: 0;

  transform:
    translate(-50%, -50%)
    scale(1.8);
}


/* =========================
   ЗНАКИ
========================= */

.sign {
  position: absolute;

  width: 90px;
  height: 110px;

  transform:
    translate(-50%, -50%);

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 72px;

  z-index: 35;
}


/* =========================
   ФИНИШ
========================= */

.finish-flag {
  position: absolute;

  left: 8820px;

  top: 39%;

  width: 120px;
  height: 300px;

  z-index: 40;
}

.flag-pole {
  position: absolute;

  left: 15px;
  top: 20px;

  width: 10px;
  height: 260px;

  background: #444;

  border-radius: 5px;
}

.flag {
  position: absolute;

  left: 25px;
  top: 20px;

  width: 100px;
  height: 75px;

  border: 3px solid #222;

  background:
    conic-gradient(
      white 25%,
      black 0 50%,
      white 0 75%,
      black 0
    )
    0 0 / 32px 32px;

  transform-origin:
    left center;

  animation:
    flagWave
    1s ease-in-out infinite alternate;
}

@keyframes flagWave {

  from {
    transform:
      skewY(-2deg);
  }

  to {
    transform:
      skewY(4deg);
  }

}


/* =========================
   МАШИНКА
========================= */

#car {
  position: absolute;

  width: 180px;
  height: 125px;

  /*
  ВАЖНО:
  теперь машина стартует
  выше и стоит ближе
  к центру дороги
  */

  left: 180px;

  top: 61%;

  transform:
    translate(-50%, -50%);

  z-index: 60;

  pointer-events: none;
}

#carInner {
  position: relative;

  width: 180px;
  height: 125px;

  transform-origin:
    center center;

  transition:
    transform .08s linear;
}


/* КОРПУС */

#carBody {
  position: absolute;

  left: 0;
  top: 0;

  width: 180px;
  height: auto;

  z-index: 3;

  pointer-events: none;
}


/* КОЛЁСА */

.wheel {
  position: absolute;

  width: 52px;
  height: 52px;

  z-index: 2;

  transform-origin:
    50% 50%;

  pointer-events: none;
}

#wheelBack {
  left: 15px;
  top: 68px;
}

#wheelFront {
  left: 115px;
  top: 68px;
}


/* =========================
   САЛЮТ
========================= */

#fireworks {
  position: absolute;

  inset: 0;

  z-index: 190;

  pointer-events: none;

  overflow: hidden;
}

.firework-particle {
  position: absolute;

  width: 12px;
  height: 12px;

  border-radius: 50%;

  animation:
    fireworkExplosion
    900ms ease-out forwards;
}

@keyframes fireworkExplosion {

  0% {
    transform:
      translate(0,0)
      scale(1);

    opacity: 1;
  }

  100% {
    transform:
      translate(
        var(--dx),
        var(--dy)
      )
      scale(.2);

    opacity: 0;
  }

}


/* =========================
   ОКНА
========================= */

.overlay {
  position: absolute;

  inset: 0;

  display: flex;

  justify-content: center;
  align-items: center;

  background:
    rgba(0,0,0,.28);

  z-index: 200;
}

.card {
  background: white;

  padding: 30px 40px;

  border-radius: 26px;

  text-align: center;

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.25);
}

.card h1 {
  margin:
    0 0 10px;
}

button {
  margin-top:
    15px;

  border:
    none;

  border-radius:
    999px;

  padding:
    14px 30px;

  background:
    #2f80ed;

  color:
    white;

  font-size:
    19px;

  font-weight:
    bold;

  cursor:
    pointer;
}

#finish {
  display: none;
}

</style>
</head>


<body>

<div id="game">


  <div id="hud">

    <div class="panel">

      Собрано:

      <span id="score">
        0
      </span>

      /25

    </div>


    <div class="panel">

      Участок:

      <span id="section">
        1
      </span>

      /5

    </div>

  </div>


  <div id="hint">

    ← назад · → вперёд · ↑ ↓ по дороге

  </div>


  <!-- МИР -->

  <div id="world">

    <div
      id="road1"
      class="road-section">
    </div>

    <div
      id="road2"
      class="road-section">
    </div>

    <div
      id="road3"
      class="road-section">
    </div>

    <div
      id="road4"
      class="road-section">
    </div>

    <div
      id="road5"
      class="road-section">
    </div>


    <div id="objectsLayer"></div>


    <div class="finish-flag">

      <div class="flag-pole"></div>

      <div class="flag"></div>

    </div>

  </div>


  <!-- МАШИНА -->

  <div id="car">

    <div id="carInner">

      <img
        id="wheelBack"
        class="wheel"
        src="car/wheel-back.png"
        alt=""
      >

      <img
        id="wheelFront"
        class="wheel"
        src="car/wheel-front.png"
        alt=""
      >

      <img
        id="carBody"
        src="car/car-body.png"
        alt="машинка"
      >

    </div>

  </div>


  <div id="fireworks"></div>


  <!-- СТАРТ -->

  <div
    id="startOverlay"
    class="overlay"
  >

    <div class="card">

      <h1>
        Поехали!
      </h1>

      <div>
        Собери все предметы и доедь до финиша.
      </div>

      <button id="startBtn">
        СТАРТ
      </button>

    </div>

  </div>


  <!-- ФИНИШ -->

  <div
    id="finish"
    class="overlay"
  >

    <div class="card">

      <h1>
        🏁 Молодец!
      </h1>

      <div>
        Ты добрался до финиша!
      </div>

      <div>

        Собрано предметов:

        <strong id="finishScore">
          25
        </strong>

        /25

      </div>

      <button id="restartBtn">
        Играть ещё
      </button>

    </div>

  </div>


</div>


<script>


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const game =
document.getElementById("game");

const world =
document.getElementById("world");

const car =
document.getElementById("car");

const carInner =
document.getElementById("carInner");

const wheelFront =
document.getElementById("wheelFront");

const wheelBack =
document.getElementById("wheelBack");

const objectsLayer =
document.getElementById("objectsLayer");

const scoreElement =
document.getElementById("score");

const sectionElement =
document.getElementById("section");

const startOverlay =
document.getElementById("startOverlay");

const finish =
document.getElementById("finish");

const finishScore =
document.getElementById("finishScore");

const fireworks =
document.getElementById("fireworks");

const startBtn =
document.getElementById("startBtn");

const restartBtn =
document.getElementById("restartBtn");


/* =========================
   РАЗМЕРЫ УЧАСТКОВ
========================= */

/*
1920 исходная ширина фона.

Но реальный шаг между
участками теперь 1770px,
так как 150px перекрываем.
*/

const SECTION_IMAGE_WIDTH =
1920;

const SECTION_STEP =
1770;

const TOTAL_SECTIONS =
5;

const WORLD_WIDTH =
SECTION_STEP * 4
+
SECTION_IMAGE_WIDTH;


/* =========================
   СКОРОСТЬ
========================= */

const SPEED_X =
7;

const SPEED_Y =
0.32;

const WHEEL_ROTATION_SPEED =
9;


/* =========================
   ПОЛОЖЕНИЕ
========================= */

let carWorldX =
250;


/*
61% — примерно центр
асфальта первого фона
*/

let carY =
61;


let cameraX =
0;

let score =
0;

let running =
false;

let finished =
false;

let wheelRotation =
0;


/* =========================
   КЛАВИШИ
========================= */

const keys = {

  ArrowLeft: false,

  ArrowRight: false,

  ArrowUp: false,

  ArrowDown: false

};


window.addEventListener(
"keydown",
event => {

  if (
    event.key in keys
  ) {

    event.preventDefault();

    keys[event.key] =
    true;

  }

});


window.addEventListener(
"keyup",
event => {

  if (
    event.key in keys
  ) {

    event.preventDefault();

    keys[event.key] =
    false;

  }

});


window.addEventListener(
"blur",
() => {

  keys.ArrowLeft =
  false;

  keys.ArrowRight =
  false;

  keys.ArrowUp =
  false;

  keys.ArrowDown =
  false;

});


/* =========================
   ВРЕМЕННЫЕ ПРЕДМЕТЫ
========================= */

const ALL_ITEMS = [

  "🍎",
  "🍐",
  "🍊",
  "🍋",
  "🍉",

  "⚽",
  "🏀",
  "🎾",
  "🧸",
  "🎈",

  "🚂",
  "🚲",
  "🚁",
  "⛵",
  "🚜",

  "🐱",
  "🐶",
  "🐭",
  "🐰",
  "🦊",

  "⭐",
  "🌙",
  "☀️",
  "🌈",
  "☁️"

];


let itemObjects =
[];


/* =========================
   СОЗДАЁМ ПРЕДМЕТЫ
========================= */

function createWorld() {

  objectsLayer.innerHTML =
  "";

  itemObjects =
  [];


  /*
  Положение предметов
  внутри каждого участка.
  */

  const offsets = [

    330,
    650,
    980,
    1310,
    1580

  ];


  /*
  Чуть ближе к дороге.
  */

  const yPositions = [

    57,
    64,
    59,
    65,
    58

  ];


  for (
    let section = 0;
    section < TOTAL_SECTIONS;
    section++
  ) {


    const sectionStart =

    section *
    SECTION_STEP;


    for (
      let i = 0;
      i < 5;
      i++
    ) {


      const index =

      section *
      5
      +
      i;


      const item =

      document.createElement(
        "div"
      );


      item.className =
      "item";


      item.innerHTML =
      ALL_ITEMS[index];


      const worldX =

      sectionStart
      +
      offsets[i];


      item.style.left =

      worldX +
      "px";


      item.style.top =

      yPositions[i] +
      "%";


      objectsLayer.appendChild(
        item
      );


      itemObjects.push({

        element:
        item,

        collected:
        false

      });

    }


    /* знак между участками */

    if (
      section <
      TOTAL_SECTIONS - 1
    ) {


      const sign =

      document.createElement(
        "div"
      );


      sign.className =
      "sign";


      sign.innerHTML =
      "🚧";


      sign.style.left =

      sectionStart
      +
      1690
      +
      "px";


      sign.style.top =
      "57%";


      objectsLayer.appendChild(
        sign
      );

    }

  }

}


/* =========================
   КОЛЁСА
========================= */

function rotateWheels(
direction
) {

  wheelRotation +=

    WHEEL_ROTATION_SPEED
    *
    direction;


  wheelFront.style.transform =

    `rotate(${wheelRotation}deg)`;


  wheelBack.style.transform =

    `rotate(${wheelRotation}deg)`;

}


/* =========================
   ДВИЖЕНИЕ
========================= */

function moveCar() {


  if (
    keys.ArrowRight
    &&
    !keys.ArrowLeft
  ) {


    carWorldX +=
    SPEED_X;


    carInner.style.transform =
    "scaleX(1)";


    rotateWheels(1);

  }


  if (
    keys.ArrowLeft
    &&
    !keys.ArrowRight
  ) {


    carWorldX -=
    SPEED_X;


    carInner.style.transform =
    "scaleX(-1)";


    rotateWheels(-1);

  }


  /*
  РУЧНОЕ ДВИЖЕНИЕ
  ВВЕРХ / ВНИЗ
  */

  if (
    keys.ArrowUp
  ) {

    carY -=
    SPEED_Y;

  }


  if (
    keys.ArrowDown
  ) {

    carY +=
    SPEED_Y;

  }


  carWorldX =

  Math.max(

    90,

    Math.min(

      WORLD_WIDTH -
      100,

      carWorldX

    )

  );


  /*
  БОЛЕЕ УЗКИЙ ДИАПАЗОН,
  ЧТОБЫ МАШИНА НЕ ЕЗДИЛА
  ПО НЕБУ И ТРАВЕ.
  */

  carY =

  Math.max(

    50,

    Math.min(

      70,

      carY

    )

  );

}


/* =========================
   КАМЕРА
========================= */

function updateCamera() {


  const gameWidth =
  game.clientWidth;


  const desiredScreenX =

  gameWidth *
  .32;


  cameraX =

  carWorldX -
  desiredScreenX;


  cameraX =

  Math.max(

    0,

    Math.min(

      WORLD_WIDTH -
      gameWidth,

      cameraX

    )

  );


  world.style.transform =

  `translateX(${-cameraX}px)`;


  const carScreenX =

  carWorldX -
  cameraX;


  car.style.left =

  carScreenX +
  "px";


  car.style.top =

  carY +
  "%";

}


/* =========================
   УЧАСТОК
========================= */

function updateSection() {


  let section =

  Math.floor(

    carWorldX /
    SECTION_STEP

  )
  +
  1;


  section =

  Math.max(

    1,

    Math.min(

      5,

      section

    )

  );


  sectionElement.textContent =
  section;

}


/* =========================
   СБОР
========================= */

function checkItems() {


  const carRect =

  car.getBoundingClientRect();


  itemObjects.forEach(
  item => {


    if (
      item.collected
    ) {

      return;

    }


    const itemRect =

    item.element
    .getBoundingClientRect();


    const collision = !(

      carRect.right <
      itemRect.left

      ||

      carRect.left >
      itemRect.right

      ||

      carRect.bottom <
      itemRect.top

      ||

      carRect.top >
      itemRect.bottom

    );


    if (
      collision
    ) {


      item.collected =
      true;


      item.element
      .classList
      .add(
        "collected"
      );


      score++;


      scoreElement.textContent =
      score;

    }

  });

}


/* =========================
   САЛЮТ
========================= */

function createFirework(
x,
y
) {


  const colors = [

    "#ff3b30",
    "#ffcc00",
    "#34c759",
    "#007aff",
    "#af52de",
    "#ff9500",
    "#ff2d9a"

  ];


  for (
    let i = 0;
    i < 24;
    i++
  ) {


    const particle =

    document.createElement(
      "div"
    );


    particle.className =
    "firework-particle";


    particle.style.left =
    x + "px";


    particle.style.top =
    y + "px";


    particle.style.background =

    colors[
      Math.floor(
        Math.random()
        *
        colors.length
      )
    ];


    const angle =

    Math.random()
    *
    Math.PI
    *
    2;


    const distance =

    50
    +
    Math.random()
    *
    100;


    particle.style.setProperty(

      "--dx",

      Math.cos(angle)
      *
      distance
      +
      "px"

    );


    particle.style.setProperty(

      "--dy",

      Math.sin(angle)
      *
      distance
      +
      "px"

    );


    fireworks.appendChild(
      particle
    );


    setTimeout(
      () => {

        particle.remove();

      },

      1000
    );

  }

}


function launchFireworks() {


  const width =
  game.clientWidth;


  const height =
  game.clientHeight;


  createFirework(
    width * .30,
    height * .32
  );


  setTimeout(
    () => {

      createFirework(
        width * .50,
        height * .20
      );

    },
    200
  );


  setTimeout(
    () => {

      createFirework(
        width * .70,
        height * .32
      );

    },
    400
  );

}


/* =========================
   ФИНИШ
========================= */

function checkFinish() {


  if (
    finished
  ) {

    return;

  }


  const FINISH_X =
  8820;


  if (
    carWorldX >=
    FINISH_X
  ) {


    finished =
    true;


    running =
    false;


    launchFireworks();


    setTimeout(
      () => {


        finishScore.textContent =
        score;


        finish.style.display =
        "flex";


      },

      950
    );

  }

}


/* =========================
   ЦИКЛ
========================= */

function gameLoop() {


  if (
    running
  ) {


    moveCar();

    updateCamera();

    updateSection();

    checkItems();

    checkFinish();

  }


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================
   СТАРТ
========================= */

function startGame() {


  carWorldX =
  250;


  /*
  машина сразу
  стоит на дороге
  */

  carY =
  61;


  cameraX =
  0;


  score =
  0;


  finished =
  false;


  wheelRotation =
  0;


  scoreElement.textContent =
  "0";


  sectionElement.textContent =
  "1";


  finish.style.display =
  "none";


  startOverlay.style.display =
  "none";


  fireworks.innerHTML =
  "";


  carInner.style.transform =
  "scaleX(1)";


  wheelFront.style.transform =
  "rotate(0deg)";


  wheelBack.style.transform =
  "rotate(0deg)";


  createWorld();


  updateCamera();


  running =
  true;

}


/* КНОПКИ */

startBtn.addEventListener(
"click",
startGame
);


restartBtn.addEventListener(
"click",
startGame
);


/* ПЕРВЫЙ ЗАПУСК */

createWorld();

updateCamera();

carInner.style.transform =
"scaleX(1)";

requestAnimationFrame(
gameLoop
);

</script>

</body>
</html>

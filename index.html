<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Машинка собирает предметы</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #eef6ff;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* =========================
   ИГРА
========================= */

#game {
  position: relative;
  width: min(1200px, 100vw);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #dff3ff;
}

/* =========================
   HUD
========================= */

#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;

  display: flex;
  justify-content: space-between;

  z-index: 100;
  pointer-events: none;
}

.panel {
  background: rgba(255,255,255,.94);
  padding: 9px 16px;
  border-radius: 22px;
  font-weight: bold;
  font-size: 18px;
  box-shadow: 0 4px 12px rgba(0,0,0,.14);
}

/* =========================
   ДЛИННЫЙ МИР
========================= */

#world {
  position: absolute;
  left: 0;
  top: 0;

  width: 9000px;
  height: 100%;

  transform: translateX(0);
  will-change: transform;
}

/* =========================
   ФОН
========================= */

#roadBackground {
  position: absolute;
  inset: 0;

  width: 9000px;
  height: 100%;

  background-image: url("items/road-main.png");
  background-size: auto 100%;
  background-repeat: repeat-x;
  background-position: left center;

  z-index: 1;
}

/* =========================
   ОБЛАКА НА СТЫКАХ
========================= */

#seamLayer {
  position: absolute;
  inset: 0;
  z-index: 12;
  pointer-events: none;
}

.seam-cloud {
  position: absolute;
  width: 290px;
  height: auto;

  transform: translate(-50%, -50%);

  pointer-events: none;
  user-select: none;
}

/* =========================
   ПРЕДМЕТЫ
========================= */

.item {
  position: absolute;

  width: 82px;
  height: 82px;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 60px;

  transform: translate(-50%, -50%);

  z-index: 30;

  transition:
    opacity .22s ease,
    transform .22s ease;
}

.item.collected {
  opacity: 0;
  transform:
    translate(-50%, -50%)
    scale(1.8);
}

/* =========================
   СВЕТОФОРЫ
========================= */

.traffic-light {
  position: absolute;

  width: 130px;

  transform: translate(-50%, -50%);

  z-index: 55;

  cursor: pointer;
  user-select: none;

  transition:
    transform .18s ease,
    filter .18s ease;
}

.traffic-light:hover {
  transform:
    translate(-50%, -50%)
    scale(1.06);
}

.traffic-light.ready {
  animation:
    trafficPulse
    .9s ease-in-out
    infinite alternate;
}

@keyframes trafficPulse {
  from {
    filter:
      drop-shadow(0 0 0 rgba(255,0,0,0));
  }

  to {
    filter:
      drop-shadow(0 0 14px rgba(255,70,70,.85));
  }
}

/* =========================
   ПОДСКАЗКА У СВЕТОФОРА
========================= */

.traffic-message {
  position: absolute;

  transform: translate(-50%, -50%);

  z-index: 70;

  background: rgba(255,255,255,.96);
  padding: 8px 14px;
  border-radius: 18px;

  font-size: 17px;
  font-weight: bold;

  box-shadow: 0 4px 12px rgba(0,0,0,.16);

  pointer-events: none;
  white-space: nowrap;

  opacity: 0;
  transition: opacity .2s ease;
}

.traffic-message.show {
  opacity: 1;
}

/* =========================
   ФИНИШ
========================= */

.finish-flag {
  position: absolute;

  left: 8750px;
  top: 39%;

  width: 120px;
  height: 300px;

  z-index: 40;
}

.flag-pole {
  position: absolute;

  left: 15px;
  top: 20px;

  width: 10px;
  height: 260px;

  background: #444;
  border-radius: 5px;
}

.flag {
  position: absolute;

  left: 25px;
  top: 20px;

  width: 100px;
  height: 75px;

  border: 3px solid #222;

  background:
    conic-gradient(
      white 25%,
      black 0 50%,
      white 0 75%,
      black 0
    )
    0 0 / 32px 32px;

  transform-origin: left center;

  animation:
    flagWave 1s ease-in-out infinite alternate;
}

@keyframes flagWave {
  from {
    transform: skewY(-2deg);
  }

  to {
    transform: skewY(4deg);
  }
}

/* =========================
   МАШИНКА
========================= */

#car {
  position: absolute;

  width: 180px;
  height: 125px;

  left: 180px;
  top: 66%;

  transform: translate(-50%, -50%);

  z-index: 60;

  pointer-events: none;
}

#carInner {
  position: relative;

  width: 180px;
  height: 125px;

  transform-origin: center center;
  transition: transform .08s linear;
}

#carBody {
  position: absolute;

  left: 0;
  top: 0;

  width: 180px;
  height: auto;

  z-index: 3;

  pointer-events: none;
}

.wheel {
  position: absolute;

  width: 52px;
  height: 52px;

  z-index: 2;

  transform-origin: 50% 50%;
  pointer-events: none;
}

#wheelBack {
  left: 15px;
  top: 68px;
}

#wheelFront {
  left: 115px;
  top: 68px;
}

/* =========================
   КНОПКИ УПРАВЛЕНИЯ
========================= */

#touchControls {
  position: absolute;
  right: 18px;
  bottom: 18px;

  display: flex;
  gap: 14px;

  z-index: 160;
}

.control-btn {
  width: 92px;
  height: 92px;

  border: none;
  border-radius: 24px;

  background: rgba(255,255,255,.95);
  box-shadow: 0 8px 18px rgba(0,0,0,.18);

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  cursor: pointer;
  user-select: none;

  font-weight: bold;
  color: #222;

  transition:
    transform .12s ease,
    box-shadow .12s ease,
    background .12s ease;
}

.control-btn:active,
.control-btn.active {
  transform: scale(.95);
  background: #eaf4ff;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
}

.control-arrow {
  font-size: 34px;
  line-height: 1;
}

.control-label {
  font-size: 15px;
  margin-top: 4px;
}

/* =========================
   САЛЮТ
========================= */

#fireworks {
  position: absolute;
  inset: 0;

  z-index: 190;
  pointer-events: none;
  overflow: hidden;
}

.firework-particle {
  position: absolute;

  width: 12px;
  height: 12px;

  border-radius: 50%;

  animation:
    fireworkExplosion
    900ms ease-out forwards;
}

@keyframes fireworkExplosion {
  0% {
    transform: translate(0,0) scale(1);
    opacity: 1;
  }

  100% {
    transform:
      translate(var(--dx), var(--dy))
      scale(.2);
    opacity: 0;
  }
}

/* =========================
   ОКНА
========================= */

.overlay {
  position: absolute;
  inset: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,.28);

  z-index: 200;
}

.card {
  background: white;
  padding: 30px 40px;
  border-radius: 26px;
  text-align: center;
  box-shadow: 0 12px 35px rgba(0,0,0,.25);
}

.card h1 {
  margin: 0 0 10px;
}

button.game-btn {
  margin-top: 15px;

  border: none;
  border-radius: 999px;

  padding: 14px 30px;

  background: #2f80ed;
  color: white;

  font-size: 19px;
  font-weight: bold;

  cursor: pointer;
}

#finish {
  display: none;
}

@media (max-width: 900px) {
  .control-btn {
    width: 78px;
    height: 78px;
    border-radius: 20px;
  }

  .control-arrow {
    font-size: 30px;
  }

  .control-label {
    font-size: 13px;
  }

  .seam-cloud {
    width: 250px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="hud">

    <div class="panel">
      Собрано:
      <span id="score">0</span>/25
    </div>

    <div class="panel">
      Участок:
      <span id="section">1</span>/5
    </div>

  </div>

  <div id="world">

    <div id="roadBackground"></div>

    <div id="seamLayer"></div>

    <div id="objectsLayer"></div>

    <div id="trafficLayer"></div>

    <div class="finish-flag" id="finishFlag">
      <div class="flag-pole"></div>
      <div class="flag"></div>
    </div>

  </div>

  <div id="car">
    <div id="carInner">

      <img
        id="wheelBack"
        class="wheel"
        src="car/wheel-back.png"
        alt=""
      >

      <img
        id="wheelFront"
        class="wheel"
        src="car/wheel-front.png"
        alt=""
      >

      <img
        id="carBody"
        src="car/car-body.png"
        alt="машинка"
      >

    </div>
  </div>

  <div id="touchControls">
    <button
      id="leftBtn"
      class="control-btn"
      type="button"
      aria-label="Назад"
    >
      <div class="control-arrow">◀</div>
      <div class="control-label">назад</div>
    </button>

    <button
      id="rightBtn"
      class="control-btn"
      type="button"
      aria-label="Вперёд"
    >
      <div class="control-arrow">▶</div>
      <div class="control-label">вперёд</div>
    </button>
  </div>

  <div id="fireworks"></div>

  <div id="startOverlay" class="overlay">
    <div class="card">
      <h1>Поехали!</h1>
      <div>Собери предметы и проезжай светофоры.</div>
      <button id="startBtn" class="game-btn">СТАРТ</button>
    </div>
  </div>

  <div id="finish" class="overlay">
    <div class="card">
      <h1>🏁 Молодец!</h1>
      <div>Ты добрался до финиша!</div>
      <div>
        Собрано предметов:
        <strong id="finishScore">25</strong>/25
      </div>
      <button id="restartBtn" class="game-btn">Играть ещё</button>
    </div>
  </div>

</div>

<script>
/* =========================
   ЭЛЕМЕНТЫ
========================= */

const game =
document.getElementById("game");

const world =
document.getElementById("world");

const roadBackground =
document.getElementById("roadBackground");

const seamLayer =
document.getElementById("seamLayer");

const finishFlag =
document.getElementById("finishFlag");

const car =
document.getElementById("car");

const carInner =
document.getElementById("carInner");

const wheelFront =
document.getElementById("wheelFront");

const wheelBack =
document.getElementById("wheelBack");

const objectsLayer =
document.getElementById("objectsLayer");

const trafficLayer =
document.getElementById("trafficLayer");

const scoreElement =
document.getElementById("score");

const sectionElement =
document.getElementById("section");

const startOverlay =
document.getElementById("startOverlay");

const finish =
document.getElementById("finish");

const finishScore =
document.getElementById("finishScore");

const fireworks =
document.getElementById("fireworks");

const startBtn =
document.getElementById("startBtn");

const restartBtn =
document.getElementById("restartBtn");

const leftBtn =
document.getElementById("leftBtn");

const rightBtn =
document.getElementById("rightBtn");

/* =========================
   МИР
========================= */

const TOTAL_SECTIONS = 5;

let SECTION_WIDTH = 2025;
let WORLD_WIDTH = SECTION_WIDTH * TOTAL_SECTIONS;
let FINISH_X = WORLD_WIDTH - 250;

/* =========================
   СКОРОСТЬ
========================= */

const SPEED_X = 7;
const WHEEL_ROTATION_SPEED = 9;

/* =========================
   ПОЛОЖЕНИЕ
========================= */

let carWorldX = 250;
let carY = 66;
let cameraX = 0;

let score = 0;
let running = false;
let finished = false;
let wheelRotation = 0;

/* =========================
   КЛАВИШИ
========================= */

const keys = {
  ArrowLeft: false,
  ArrowRight: false
};

window.addEventListener(
"keydown",
event => {

  if (event.key in keys) {
    event.preventDefault();
    keys[event.key] = true;
  }

});

window.addEventListener(
"keyup",
event => {

  if (event.key in keys) {
    event.preventDefault();
    keys[event.key] = false;
  }

});

window.addEventListener(
"blur",
() => {

  keys.ArrowLeft = false;
  keys.ArrowRight = false;

  leftBtn.classList.remove("active");
  rightBtn.classList.remove("active");

});

/* =========================
   СЕНСОРНЫЕ КНОПКИ
========================= */

function bindHoldButton(button, keyName) {

  const press = (event) => {
    event.preventDefault();
    keys[keyName] = true;
    button.classList.add("active");
  };

  const release = (event) => {
    event.preventDefault();
    keys[keyName] = false;
    button.classList.remove("active");
  };

  button.addEventListener("mousedown", press);
  button.addEventListener("touchstart", press, { passive: false });

  button.addEventListener("mouseup", release);
  button.addEventListener("mouseleave", release);
  button.addEventListener("touchend", release, { passive: false });
  button.addEventListener("touchcancel", release, { passive: false });
}

bindHoldButton(leftBtn, "ArrowLeft");
bindHoldButton(rightBtn, "ArrowRight");

/* =========================
   ПРЕДМЕТЫ
========================= */

const ALL_ITEMS = [
  "🍎","🍐","🍊","🍋","🍉",
  "⚽","🏀","🎾","🧸","🎈",
  "🚂","🚲","🚁","⛵","🚜",
  "🐱","🐶","🐭","🐰","🦊",
  "⭐","🌙","☀️","🌈","☁️"
];

let itemObjects = [];
let trafficLights = [];

/* =========================
   РЕАЛЬНАЯ ШИРИНА ФОНА
========================= */

function calculateWorldSize() {

  const bgImage = new Image();

  bgImage.src = "items/road-main.png";

  bgImage.onload = () => {

    const gameHeight = game.clientHeight;
    const ratio = bgImage.naturalWidth / bgImage.naturalHeight;

    SECTION_WIDTH = gameHeight * ratio;
    WORLD_WIDTH = SECTION_WIDTH * TOTAL_SECTIONS;
    FINISH_X = WORLD_WIDTH - 250;

    world.style.width = WORLD_WIDTH + "px";
    roadBackground.style.width = WORLD_WIDTH + "px";
    seamLayer.style.width = WORLD_WIDTH + "px";
    finishFlag.style.left = FINISH_X + "px";

    createSeamClouds();
    createWorld();
    createTrafficLights();
    updateCamera();
  };

}

/* =========================
   ОБЛАКА НА СТЫКАХ
========================= */

function createSeamClouds() {

  seamLayer.innerHTML = "";

  for (let i = 1; i < TOTAL_SECTIONS; i++) {

    const cloudX = SECTION_WIDTH * i;

    const cloud = document.createElement("img");
    cloud.className = "seam-cloud";
    cloud.src = "items/cloud-seam.png";
    cloud.alt = "";

    cloud.style.left = cloudX + "px";

    /*
    Высота облака.
    Если захотите чуть выше
    или ниже — меняйте тут.
    */
    cloud.style.top = "18%";

    seamLayer.appendChild(cloud);
  }

}

/* =========================
   СОЗДАНИЕ ПРЕДМЕТОВ
========================= */

function createWorld() {

  objectsLayer.innerHTML = "";
  itemObjects = [];

  const relativeOffsets = [
    0.16,
    0.33,
    0.50,
    0.67,
    0.84
  ];

  const yPositions = [
    62,
    66,
    61,
    67,
    63
  ];

  for (let section = 0; section < TOTAL_SECTIONS; section++) {

    const sectionStart = section * SECTION_WIDTH;

    for (let i = 0; i < 5; i++) {

      const index = section * 5 + i;

      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = ALL_ITEMS[index];

      const worldX =
        sectionStart +
        SECTION_WIDTH * relativeOffsets[i];

      item.style.left = worldX + "px";
      item.style.top = yPositions[i] + "%";

      objectsLayer.appendChild(item);

      itemObjects.push({
        element: item,
        collected: false
      });
    }
  }
}

/* =========================
   СВЕТОФОРЫ НА СТЫКАХ
========================= */

function createTrafficLights() {

  trafficLayer.innerHTML = "";
  trafficLights = [];

  for (let i = 1; i < TOTAL_SECTIONS; i++) {

    const trafficX = SECTION_WIDTH * i;

    const img = document.createElement("img");
    img.className = "traffic-light";
    img.src = "items/traffic-red.png";
    img.alt = "Светофор";
    img.style.left = trafficX + "px";
    img.style.top = "50%";

    const message = document.createElement("div");
    message.className = "traffic-message";
    message.textContent = "Нажми на светофор";
    message.style.left = trafficX + "px";
    message.style.top = "31%";

    trafficLayer.appendChild(img);
    trafficLayer.appendChild(message);

    const trafficObject = {
      x: trafficX,
      green: false,
      element: img,
      message: message
    };

    img.addEventListener("click", () => {

      const distance =
        Math.abs(carWorldX - trafficX);

      if (distance <= 400) {
        trafficObject.green = true;
        img.src = "items/traffic-green.png";
        img.classList.remove("ready");
        message.classList.remove("show");
      }

    });

    trafficLights.push(trafficObject);
  }
}

/* =========================
   СВЕТОФОРЫ
========================= */

function updateTrafficLights() {

  trafficLights.forEach(traffic => {

    if (traffic.green) {
      traffic.element.classList.remove("ready");
      traffic.message.classList.remove("show");
      return;
    }

    const distance = traffic.x - carWorldX;

    if (distance > 0 && distance < 450) {
      traffic.element.classList.add("ready");
      traffic.message.classList.add("show");
    } else {
      traffic.element.classList.remove("ready");
      traffic.message.classList.remove("show");
    }

  });
}

/* =========================
   КРАСНЫЙ СВЕТ
========================= */

function canMoveForward() {

  for (const traffic of trafficLights) {

    if (traffic.green) {
      continue;
    }

    const stopX = traffic.x - 145;

    if (carWorldX >= stopX && carWorldX <= traffic.x) {
      return false;
    }
  }

  return true;
}

/* =========================
   КОЛЁСА
========================= */

function rotateWheels(direction) {

  wheelRotation += WHEEL_ROTATION_SPEED * direction;

  wheelFront.style.transform =
    `rotate(${wheelRotation}deg)`;

  wheelBack.style.transform =
    `rotate(${wheelRotation}deg)`;
}

/* =========================
   ДВИЖЕНИЕ
========================= */

function moveCar() {

  if (keys.ArrowRight && !keys.ArrowLeft) {

    if (canMoveForward()) {
      carWorldX += SPEED_X;
      rotateWheels(1);
    }

    carInner.style.transform = "scaleX(1)";
  }

  if (keys.ArrowLeft && !keys.ArrowRight) {
    carWorldX -= SPEED_X;
    carInner.style.transform = "scaleX(-1)";
    rotateWheels(-1);
  }

  carWorldX = Math.max(
    90,
    Math.min(WORLD_WIDTH - 100, carWorldX)
  );
}

/* =========================
   КАМЕРА
========================= */

function updateCamera() {

  const gameWidth = game.clientWidth;
  const desiredScreenX = gameWidth * 0.32;

  cameraX = carWorldX - desiredScreenX;

  cameraX = Math.max(
    0,
    Math.min(WORLD_WIDTH - gameWidth, cameraX)
  );

  world.style.transform =
    `translateX(${-cameraX}px)`;

  const carScreenX = carWorldX - cameraX;

  car.style.left = carScreenX + "px";
  car.style.top = carY + "%";
}

/* =========================
   УЧАСТОК
========================= */

function updateSection() {

  let section =
    Math.floor(carWorldX / SECTION_WIDTH) + 1;

  section = Math.max(
    1,
    Math.min(TOTAL_SECTIONS, section)
  );

  sectionElement.textContent = section;
}

/* =========================
   СБОР ПРЕДМЕТОВ
========================= */

function checkItems() {

  const carRect = car.getBoundingClientRect();

  itemObjects.forEach(item => {

    if (item.collected) {
      return;
    }

    const itemRect =
      item.element.getBoundingClientRect();

    const collision = !(
      carRect.right < itemRect.left ||
      carRect.left > itemRect.right ||
      carRect.bottom < itemRect.top ||
      carRect.top > itemRect.bottom
    );

    if (collision) {
      item.collected = true;
      item.element.classList.add("collected");
      score++;
      scoreElement.textContent = score;
    }
  });
}

/* =========================
   САЛЮТ
========================= */

function createFirework(x, y) {

  const colors = [
    "#ff3b30",
    "#ffcc00",
    "#34c759",
    "#007aff",
    "#af52de",
    "#ff9500",
    "#ff2d9a"
  ];

  for (let i = 0; i < 24; i++) {

    const particle =
      document.createElement("div");

    particle.className = "firework-particle";
    particle.style.left = x + "px";
    particle.style.top = y + "px";
    particle.style.background =
      colors[Math.floor(Math.random() * colors.length)];

    const angle = Math.random() * Math.PI * 2;
    const distance = 50 + Math.random() * 100;

    particle.style.setProperty(
      "--dx",
      Math.cos(angle) * distance + "px"
    );

    particle.style.setProperty(
      "--dy",
      Math.sin(angle) * distance + "px"
    );

    fireworks.appendChild(particle);

    setTimeout(() => {
      particle.remove();
    }, 1000);
  }
}

function launchFireworks() {

  const width = game.clientWidth;
  const height = game.clientHeight;

  createFirework(width * .30, height * .32);

  setTimeout(() => {
    createFirework(width * .50, height * .20);
  }, 200);

  setTimeout(() => {
    createFirework(width * .70, height * .32);
  }, 400);
}

/* =========================
   ФИНИШ
========================= */

function checkFinish() {

  if (finished) {
    return;
  }

  if (carWorldX >= FINISH_X) {
    finished = true;
    running = false;

    launchFireworks();

    setTimeout(() => {
      finishScore.textContent = score;
      finish.style.display = "flex";
    }, 950);
  }
}

/* =========================
   ЦИКЛ
========================= */

function gameLoop() {

  if (running) {
    moveCar();
    updateCamera();
    updateSection();
    updateTrafficLights();
    checkItems();
    checkFinish();
  }

  requestAnimationFrame(gameLoop);
}

/* =========================
   СТАРТ
========================= */

function startGame() {

  carWorldX = 250;
  carY = 66;
  cameraX = 0;

  score = 0;
  finished = false;
  wheelRotation = 0;

  keys.ArrowLeft = false;
  keys.ArrowRight = false;

  leftBtn.classList.remove("active");
  rightBtn.classList.remove("active");

  scoreElement.textContent = "0";
  sectionElement.textContent = "1";

  finish.style.display = "none";
  startOverlay.style.display = "none";
  fireworks.innerHTML = "";

  carInner.style.transform = "scaleX(1)";
  wheelFront.style.transform = "rotate(0deg)";
  wheelBack.style.transform = "rotate(0deg)";

  createSeamClouds();
  createWorld();
  createTrafficLights();
  updateCamera();

  running = true;
}

/* =========================
   КНОПКИ
========================= */

startBtn.addEventListener("click", startGame);
restartBtn.addEventListener("click", startGame);

/* =========================
   ЗАПУСК
========================= */

calculateWorldSize();
updateCamera();
requestAnimationFrame(gameLoop);

window.addEventListener(
"resize",
() => {
  calculateWorldSize();
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Машинка собирает предметы</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #eef6ff;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

#game {
  position: relative;
  width: min(1200px, 100vw);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #9bd486;
}

/* ПАНЕЛЬ */

#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  z-index: 100;
  pointer-events: none;
}

.panel {
  background: rgba(255,255,255,.93);
  padding: 9px 16px;
  border-radius: 22px;
  font-weight: bold;
  font-size: 18px;
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

#hint {
  position: absolute;
  left: 50%;
  top: 65px;
  transform: translateX(-50%);
  z-index: 100;
  background: rgba(255,255,255,.92);
  padding: 8px 16px;
  border-radius: 25px;
  font-weight: bold;
  pointer-events: none;
}

/* МИР */

#world {
  position: absolute;
  left: 0;
  top: 0;
  width: 6200px;
  height: 100%;
  transform: translateX(0);
}

#background {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      #bfe9ff 0%,
      #bfe9ff 43%,
      #91d27d 43%,
      #91d27d 100%
    );
}

/* ДОРОГА */

#road {
  position: absolute;
  left: 0;
  top: 48%;
  width: 100%;
  height: 42%;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 130px,
      rgba(255,255,255,.95) 130px 200px,
      transparent 200px 330px
    ),
    #666;

  border-top: 10px solid white;
  border-bottom: 10px solid white;
}

/* ПРЕДМЕТЫ */

.item {
  position: absolute;
  width: 80px;
  height: 80px;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 60px;
  transform: translate(-50%, -50%);
  z-index: 20;

  transition:
    opacity .2s ease,
    transform .2s ease;
}

.item.collected {
  opacity: 0;
  transform:
    translate(-50%, -50%)
    scale(1.8);
}

/* ЗНАКИ */

.sign {
  position: absolute;
  width: 90px;
  height: 110px;
  transform: translate(-50%, -50%);

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 72px;
  z-index: 15;
}

/* ФИНИШ */

.finish-flag {
  position: absolute;
  left: 6030px;
  top: 41%;

  width: 120px;
  height: 300px;

  z-index: 30;
}

.flag-pole {
  position: absolute;
  left: 15px;
  top: 20px;
  width: 10px;
  height: 260px;
  background: #444;
  border-radius: 5px;
}

.flag {
  position: absolute;
  left: 25px;
  top: 20px;

  width: 100px;
  height: 75px;

  border: 3px solid #222;

  background:
    conic-gradient(
      white 25%,
      black 0 50%,
      white 0 75%,
      black 0
    )
    0 0 / 32px 32px;

  transform-origin: left center;

  animation:
    flagWave 1s ease-in-out infinite alternate;
}

@keyframes flagWave {
  from {
    transform: skewY(-2deg);
  }

  to {
    transform: skewY(4deg);
  }
}

/* МАШИНКА */

#car {
  position: absolute;

  width: 180px;
  height: 120px;

  left: 180px;
  top: 69%;

  transform: translate(-50%, -50%);

  z-index: 50;
  pointer-events: none;
}

#carInner {
  position: relative;
  width: 180px;
  height: 120px;

  transform-origin: center center;
  transition: transform .08s linear;
}

/* КОРПУС */

#carBody {
  position: absolute;

  left: 0;
  top: 0;

  width: 180px;
  height: auto;

  z-index: 3;
  pointer-events: none;
}

/* КОЛЁСА */

.wheel {
  position: absolute;

  width: 52px;
  height: 52px;

  z-index: 2;

  transform-origin: 50% 50%;
  pointer-events: none;
}

/* ЗАДНЕЕ КОЛЕСО */

#wheelBack {
  left: 15px;
  top: 68px;
}

/* ПЕРЕДНЕЕ КОЛЕСО */

#wheelFront {
  left: 115px;
  top: 68px;
}

/* САЛЮТ */

#fireworks {
  position: absolute;
  inset: 0;

  z-index: 190;

  pointer-events: none;
  overflow: hidden;
}

.firework-particle {
  position: absolute;

  width: 12px;
  height: 12px;

  border-radius: 50%;

  animation:
    fireworkExplosion
    900ms ease-out forwards;
}

@keyframes fireworkExplosion {
  0% {
    transform:
      translate(0,0)
      scale(1);

    opacity: 1;
  }

  100% {
    transform:
      translate(
        var(--dx),
        var(--dy)
      )
      scale(.2);

    opacity: 0;
  }
}

/* ОКНА */

.overlay {
  position: absolute;
  inset: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,.28);

  z-index: 200;
}

.card {
  background: white;

  padding: 30px 40px;

  border-radius: 26px;

  text-align: center;

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.25);
}

.card h1 {
  margin: 0 0 10px;
}

button {
  margin-top: 15px;

  border: none;
  border-radius: 999px;

  padding: 14px 30px;

  background: #2f80ed;

  color: white;

  font-size: 19px;

  font-weight: bold;

  cursor: pointer;
}

#finish {
  display: none;
}
</style>
</head>

<body>

<div id="game">

  <div id="hud">

    <div class="panel">
      Собрано:
      <span id="score">0</span>/25
    </div>

    <div class="panel">
      Участок:
      <span id="section">1</span>/5
    </div>

  </div>

  <div id="hint">
    ← назад · → вперёд · ↑ ↓ по дороге
  </div>

  <div id="world">

    <div id="background"></div>

    <div id="road"></div>

    <div id="objectsLayer"></div>

    <div class="finish-flag">
      <div class="flag-pole"></div>
      <div class="flag"></div>
    </div>

  </div>

  <!-- МАШИНКА -->

  <div id="car">

    <div id="carInner">

      <img
        id="wheelBack"
        class="wheel"
        src="car/wheel-back.png"
        alt=""
      >

      <img
        id="wheelFront"
        class="wheel"
        src="car/wheel-front.png"
        alt=""
      >

      <img
        id="carBody"
        src="car/car-body.png"
        alt="машинка"
      >

    </div>

  </div>

  <div id="fireworks"></div>

  <!-- СТАРТ -->

  <div
    id="startOverlay"
    class="overlay"
  >

    <div class="card">

      <h1>Поехали!</h1>

      <div>
        Собери все предметы и доедь до финиша.
      </div>

      <button id="startBtn">
        СТАРТ
      </button>

    </div>

  </div>

  <!-- ФИНИШ -->

  <div
    id="finish"
    class="overlay"
  >

    <div class="card">

      <h1>🏁 Молодец!</h1>

      <div>
        Ты добрался до финиша!
      </div>

      <div>
        Собрано предметов:
        <strong id="finishScore">25</strong>/25
      </div>

      <button id="restartBtn">
        Играть ещё
      </button>

    </div>

  </div>

</div>


<script>

/* ЭЛЕМЕНТЫ */

const game =
document.getElementById("game");

const world =
document.getElementById("world");

const car =
document.getElementById("car");

const carInner =
document.getElementById("carInner");

const wheelFront =
document.getElementById("wheelFront");

const wheelBack =
document.getElementById("wheelBack");

const objectsLayer =
document.getElementById("objectsLayer");

const scoreElement =
document.getElementById("score");

const sectionElement =
document.getElementById("section");

const startOverlay =
document.getElementById("startOverlay");

const finish =
document.getElementById("finish");

const finishScore =
document.getElementById("finishScore");

const fireworks =
document.getElementById("fireworks");

const startBtn =
document.getElementById("startBtn");

const restartBtn =
document.getElementById("restartBtn");


/* НАСТРОЙКИ */

const WORLD_WIDTH =
6200;

const TOTAL_SECTIONS =
5;

const SECTION_WIDTH =
WORLD_WIDTH /
TOTAL_SECTIONS;

const ITEMS_PER_SECTION =
5;

const SPEED_X =
6;

const SPEED_Y =
0.4;

const WHEEL_ROTATION_SPEED =
8;


/* ПОЛОЖЕНИЕ */

let carWorldX =
180;

let carY =
69;

let cameraX =
0;

let score =
0;

let running =
false;

let finished =
false;

let wheelRotation =
0;


/* КЛАВИШИ */

const keys = {

  ArrowLeft: false,

  ArrowRight: false,

  ArrowUp: false,

  ArrowDown: false

};


window.addEventListener(
"keydown",
event => {

  if (
    event.key in keys
  ) {

    event.preventDefault();

    keys[event.key] =
    true;

  }

});


window.addEventListener(
"keyup",
event => {

  if (
    event.key in keys
  ) {

    event.preventDefault();

    keys[event.key] =
    false;

  }

});


window.addEventListener(
"blur",
() => {

  keys.ArrowLeft =
  false;

  keys.ArrowRight =
  false;

  keys.ArrowUp =
  false;

  keys.ArrowDown =
  false;

});


/* 25 ВРЕМЕННЫХ ПРЕДМЕТОВ */

const ALL_ITEMS = [

  "🍎",
  "🍐",
  "🍊",
  "🍋",
  "🍉",

  "⚽",
  "🏀",
  "🎾",
  "🧸",
  "🎈",

  "🚂",
  "🚲",
  "🚁",
  "⛵",
  "🚜",

  "🐱",
  "🐶",
  "🐭",
  "🐰",
  "🦊",

  "⭐",
  "🌙",
  "☀️",
  "🌈",
  "☁️"

];


let itemObjects =
[];


/* СОЗДАЁМ МИР */

function createWorld() {

  objectsLayer.innerHTML =
  "";

  itemObjects =
  [];


  for (

    let section = 0;

    section <
    TOTAL_SECTIONS;

    section++

  ) {


    const sectionStart =

    section *
    SECTION_WIDTH;


    const offsets = [

      260,
      460,
      660,
      860,
      1060

    ];


    const yPositions = [

      65,
      74,
      59,
      70,
      63

    ];


    for (

      let i = 0;

      i <
      ITEMS_PER_SECTION;

      i++

    ) {


      const index =

      section *
      ITEMS_PER_SECTION
      +
      i;


      const item =

      document.createElement(
        "div"
      );


      item.className =
      "item";


      item.innerHTML =
      ALL_ITEMS[index];


      const worldX =

      sectionStart +
      offsets[i];


      item.style.left =

      worldX +
      "px";


      item.style.top =

      yPositions[i] +
      "%";


      objectsLayer.appendChild(
        item
      );


      itemObjects.push({

        element:
        item,

        collected:
        false

      });

    }


    /* ЗНАК ПОСЛЕ КАЖДОЙ ПЯТЁРКИ */

    if (
      section <
      TOTAL_SECTIONS - 1
    ) {


      const sign =

      document.createElement(
        "div"
      );


      sign.className =
      "sign";


      sign.innerHTML =
      "🚧";


      sign.style.left =

      sectionStart
      +
      SECTION_WIDTH
      -
      100
      +
      "px";


      sign.style.top =
      "60%";


      objectsLayer.appendChild(
        sign
      );

    }

  }

}


/* ВРАЩЕНИЕ КОЛЁС */

function rotateWheels(
direction
) {

  wheelRotation +=

    WHEEL_ROTATION_SPEED
    *
    direction;


  wheelFront.style.transform =

    `rotate(${wheelRotation}deg)`;


  wheelBack.style.transform =

    `rotate(${wheelRotation}deg)`;

}


/* ДВИЖЕНИЕ */

function moveCar() {


  /* ВПЕРЁД */

  if (
    keys.ArrowRight
    &&
    !keys.ArrowLeft
  ) {

    carWorldX +=
    SPEED_X;


    carInner.style.transform =
    "scaleX(1)";


    rotateWheels(1);

  }


  /* НАЗАД */

  if (
    keys.ArrowLeft
    &&
    !keys.ArrowRight
  ) {

    carWorldX -=
    SPEED_X;


    carInner.style.transform =
    "scaleX(-1)";


    rotateWheels(-1);

  }


  /* ВВЕРХ */

  if (
    keys.ArrowUp
  ) {

    carY -=
    SPEED_Y;

  }


  /* ВНИЗ */

  if (
    keys.ArrowDown
  ) {

    carY +=
    SPEED_Y;

  }


  /* ГРАНИЦЫ */

  carWorldX =

  Math.max(

    70,

    Math.min(

      WORLD_WIDTH -
      70,

      carWorldX

    )

  );


  carY =

  Math.max(

    54,

    Math.min(

      83,

      carY

    )

  );

}


/* КАМЕРА */

function updateCamera() {


  const gameWidth =
  game.clientWidth;


  const desiredScreenX =

  gameWidth *
  0.35;


  cameraX =

  carWorldX -
  desiredScreenX;


  cameraX =

  Math.max(

    0,

    Math.min(

      WORLD_WIDTH -
      gameWidth,

      cameraX

    )

  );


  world.style.transform =

  `translateX(${-cameraX}px)`;


  const carScreenX =

  carWorldX -
  cameraX;


  car.style.left =

  carScreenX +
  "px";


  car.style.top =

  carY +
  "%";

}


/* УЧАСТОК */

function updateSection() {


  let section =

  Math.floor(

    carWorldX /
    SECTION_WIDTH

  )
  +
  1;


  section =

  Math.max(

    1,

    Math.min(

      TOTAL_SECTIONS,

      section

    )

  );


  sectionElement.textContent =
  section;

}


/* СБОР ПРЕДМЕТОВ */

function checkItems() {


  const carRect =

  car.getBoundingClientRect();


  itemObjects.forEach(
  item => {


    if (
      item.collected
    ) {

      return;

    }


    const itemRect =

    item.element
    .getBoundingClientRect();


    const collision = !(

      carRect.right <
      itemRect.left

      ||

      carRect.left >
      itemRect.right

      ||

      carRect.bottom <
      itemRect.top

      ||

      carRect.top >
      itemRect.bottom

    );


    if (
      collision
    ) {


      item.collected =
      true;


      item.element
      .classList
      .add(
        "collected"
      );


      score++;


      scoreElement.textContent =
      score;

    }

  });

}


/* САЛЮТ */

function createFirework(
x,
y
) {


  const colors = [

    "#ff3b30",
    "#ffcc00",
    "#34c759",
    "#007aff",
    "#af52de",
    "#ff9500"

  ];


  for (
    let i = 0;
    i < 22;
    i++
  ) {


    const particle =

    document.createElement(
      "div"
    );


    particle.className =
    "firework-particle";


    particle.style.left =
    x + "px";


    particle.style.top =
    y + "px";


    particle.style.background =

    colors[
      Math.floor(
        Math.random()
        *
        colors.length
      )
    ];


    const angle =

    Math.random()
    *
    Math.PI
    *
    2;


    const distance =

    50
    +
    Math.random()
    *
    100;


    particle.style.setProperty(

      "--dx",

      Math.cos(angle)
      *
      distance
      +
      "px"

    );


    particle.style.setProperty(

      "--dy",

      Math.sin(angle)
      *
      distance
      +
      "px"

    );


    fireworks.appendChild(
      particle
    );


    setTimeout(
      () => {

        particle.remove();

      },

      1000
    );

  }

}


function launchFireworks() {


  const width =
  game.clientWidth;


  const height =
  game.clientHeight;


  createFirework(
    width * 0.30,
    height * 0.35
  );


  setTimeout(
    () => {

      createFirework(
        width * 0.50,
        height * 0.23
      );

    },
    220
  );


  setTimeout(
    () => {

      createFirework(
        width * 0.70,
        height * 0.35
      );

    },
    440
  );

}


/* ФИНИШ */

function checkFinish() {


  if (
    finished
  ) {

    return;

  }


  const FINISH_X =
  6030;


  if (
    carWorldX >=
    FINISH_X
  ) {


    finished =
    true;


    running =
    false;


    launchFireworks();


    setTimeout(
      () => {


        finishScore.textContent =
        score;


        finish.style.display =
        "flex";


      },
      900
    );

  }

}


/* ОСНОВНОЙ ЦИКЛ */

function gameLoop() {


  if (
    running
  ) {


    moveCar();

    updateCamera();

    updateSection();

    checkItems();

    checkFinish();

  }


  requestAnimationFrame(
    gameLoop
  );

}


/* СТАРТ */

function startGame() {


  carWorldX =
  180;


  carY =
  69;


  cameraX =
  0;


  score =
  0;


  finished =
  false;


  wheelRotation =
  0;


  scoreElement.textContent =
  "0";


  sectionElement.textContent =
  "1";


  finish.style.display =
  "none";


  startOverlay.style.display =
  "none";


  fireworks.innerHTML =
  "";


  carInner.style.transform =
  "scaleX(1)";


  wheelFront.style.transform =
  "rotate(0deg)";


  wheelBack.style.transform =
  "rotate(0deg)";


  createWorld();


  updateCamera();


  running =
  true;

}


/* КНОПКИ */

startBtn.addEventListener(
"click",
startGame
);


restartBtn.addEventListener(
"click",
startGame
);


/* ПЕРВЫЙ ЗАПУСК */

createWorld();

updateCamera();

carInner.style.transform =
"scaleX(1)";

requestAnimationFrame(
gameLoop
);

</script>

</body>
</html>

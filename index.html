<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Машинка — звук Щ</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #eef6ff;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

#game {
  position: relative;
  width: min(1200px, 100vw);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #dff3ff;
}

/* HUD */

#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;

  display: flex;
  justify-content: space-between;

  z-index: 100;
  pointer-events: none;
}

.panel {
  background: rgba(255,255,255,.95);
  padding: 9px 16px;
  border-radius: 22px;
  font-size: 18px;
  font-weight: bold;
  box-shadow: 0 4px 12px rgba(0,0,0,.14);
}

/* МИР */

#world {
  position: absolute;
  left: 0;
  top: 0;

  width: 9000px;
  height: 100%;

  transform: translateX(0);
  will-change: transform;
}

/* ФОН */

#roadBackground {
  position: absolute;
  inset: 0;

  width: 9000px;
  height: 100%;

  background-image:
    url("items/road-main.png");

  background-size:
    auto 100%;

  background-repeat:
    repeat-x;

  background-position:
    left center;

  z-index: 1;
}

/* ОБЛАКА */

#seamLayer {
  position: absolute;
  inset: 0;
  z-index: 12;
  pointer-events: none;
}

.seam-cloud {
  position: absolute;
  width: 290px;
  height: auto;

  transform:
    translate(-50%, -50%);

  pointer-events: none;
}

/* ПРЕДМЕТЫ */

.item {
  position: absolute;

  width: 105px;
  height: 105px;

  display: flex;
  justify-content: center;
  align-items: center;

  transform:
    translate(-50%, -50%);

  z-index: 35;

  transition:
    opacity .25s ease,
    transform .25s ease;
}

.item img {
  display: block;

  max-width: 100%;
  max-height: 100%;

  object-fit: contain;

  pointer-events: none;

  filter:
    drop-shadow(
      0 5px 5px rgba(0,0,0,.18)
    );
}

.item.collected {
  opacity: 0;

  transform:
    translate(-50%, -50%)
    scale(1.6);
}

/* СВЕТОФОРЫ */

.traffic-light {
  position: absolute;

  width: 130px;
  height: auto;

  transform:
    translate(-50%, -50%);

  z-index: 55;

  cursor: pointer;
  user-select: none;

  transition:
    transform .18s ease,
    filter .18s ease;
}

.traffic-light:hover {
  transform:
    translate(-50%, -50%)
    scale(1.06);
}

.traffic-light.ready {
  animation:
    trafficPulse
    .9s ease-in-out
    infinite alternate;
}

@keyframes trafficPulse {

  from {
    filter:
      drop-shadow(
        0 0 0 rgba(255,0,0,0)
      );
  }

  to {
    filter:
      drop-shadow(
        0 0 14px rgba(255,70,70,.9)
      );
  }

}

/* ПОДСКАЗКА */

.traffic-message {
  position: absolute;

  transform:
    translate(-50%, -50%);

  z-index: 70;

  background:
    rgba(255,255,255,.97);

  padding:
    8px 14px;

  border-radius:
    18px;

  font-size:
    17px;

  font-weight:
    bold;

  box-shadow:
    0 4px 12px rgba(0,0,0,.16);

  white-space: nowrap;

  pointer-events: none;

  opacity: 0;

  transition:
    opacity .2s ease;
}

.traffic-message.show {
  opacity: 1;
}

/* ФИНИШ */

.finish-flag {
  position: absolute;

  left: 8750px;
  top: 38%;

  width: 120px;
  height: 300px;

  z-index: 40;
}

.flag-pole {
  position: absolute;

  left: 15px;
  top: 20px;

  width: 10px;
  height: 260px;

  background: #444;

  border-radius: 5px;
}

.flag {
  position: absolute;

  left: 25px;
  top: 20px;

  width: 100px;
  height: 75px;

  border:
    3px solid #222;

  background:
    conic-gradient(
      white 25%,
      black 0 50%,
      white 0 75%,
      black 0
    )
    0 0 / 32px 32px;

  transform-origin:
    left center;

  animation:
    flagWave
    1s ease-in-out
    infinite alternate;
}

@keyframes flagWave {

  from {
    transform:
      skewY(-2deg);
  }

  to {
    transform:
      skewY(4deg);
  }

}

/* МАШИНКА */

#car {
  position: absolute;

  width: 180px;
  height: 125px;

  left: 120px;
  top: 66%;

  transform:
    translate(-50%, -50%);

  z-index: 60;

  pointer-events: none;
}

#carInner {
  position: relative;

  width: 180px;
  height: 125px;

  transform-origin:
    center center;

  transition:
    transform .08s linear;
}

#carBody {
  position: absolute;

  left: 0;
  top: 0;

  width: 180px;

  z-index: 3;

  pointer-events: none;
}

.wheel {
  position: absolute;

  width: 52px;
  height: 52px;

  z-index: 2;

  transform-origin:
    50% 50%;

  pointer-events: none;
}

#wheelBack {
  left: 15px;
  top: 68px;
}

#wheelFront {
  left: 115px;
  top: 68px;
}

/* УПРАВЛЕНИЕ */

#touchControls {
  position: absolute;

  right: 18px;
  bottom: 18px;

  display: flex;
  gap: 14px;

  z-index: 160;
}

.control-btn {
  width: 92px;
  height: 92px;

  border: none;
  border-radius: 24px;

  background:
    rgba(255,255,255,.96);

  box-shadow:
    0 8px 18px rgba(0,0,0,.18);

  display: flex;

  flex-direction: column;

  justify-content: center;
  align-items: center;

  cursor: pointer;

  user-select: none;

  font-weight: bold;

  color: #222;

  transition:
    transform .12s ease,
    background .12s ease;
}

.control-btn:active,
.control-btn.active {

  transform:
    scale(.94);

  background:
    #eaf4ff;
}

.control-arrow {
  font-size: 34px;
  line-height: 1;
}

.control-label {
  margin-top: 4px;
  font-size: 15px;
}

/* САЛЮТ */

#fireworks {
  position: absolute;
  inset: 0;

  z-index: 190;

  pointer-events: none;

  overflow: hidden;
}

.firework-particle {
  position: absolute;

  width: 12px;
  height: 12px;

  border-radius: 50%;

  animation:
    fireworkExplosion
    900ms ease-out forwards;
}

@keyframes fireworkExplosion {

  0% {
    transform:
      translate(0,0)
      scale(1);

    opacity: 1;
  }

  100% {
    transform:
      translate(
        var(--dx),
        var(--dy)
      )
      scale(.2);

    opacity: 0;
  }

}

/* ОКНА */

.overlay {
  position: absolute;
  inset: 0;

  display: flex;

  justify-content: center;
  align-items: center;

  background:
    rgba(0,0,0,.28);

  z-index: 200;
}

.card {
  background: white;

  padding:
    30px 40px;

  border-radius:
    26px;

  text-align: center;

  box-shadow:
    0 12px 35px rgba(0,0,0,.25);
}

.card h1 {
  margin:
    0 0 10px;
}

button.game-btn {
  margin-top:
    15px;

  border:
    none;

  border-radius:
    999px;

  padding:
    14px 30px;

  background:
    #2f80ed;

  color:
    white;

  font-size:
    19px;

  font-weight:
    bold;

  cursor:
    pointer;
}

#finish {
  display: none;
}

@media (max-width: 900px) {

  .control-btn {
    width: 78px;
    height: 78px;

    border-radius: 20px;
  }

  .control-arrow {
    font-size: 30px;
  }

  .control-label {
    font-size: 13px;
  }

  .item {
    width: 88px;
    height: 88px;
  }

  .seam-cloud {
    width: 250px;
  }

}

</style>
</head>

<body>

<div id="game">

  <div id="hud">

    <div class="panel">
      Собрано:
      <span id="score">0</span>/25
    </div>

    <div class="panel">
      Участок:
      <span id="section">1</span>/5
    </div>

  </div>

  <div id="world">

    <div id="roadBackground"></div>

    <div id="seamLayer"></div>

    <div id="objectsLayer"></div>

    <div id="trafficLayer"></div>

    <div
      class="finish-flag"
      id="finishFlag"
    >

      <div class="flag-pole"></div>

      <div class="flag"></div>

    </div>

  </div>

  <div id="car">

    <div id="carInner">

      <img
        id="wheelBack"
        class="wheel"
        src="car/wheel-back.png"
        alt=""
      >

      <img
        id="wheelFront"
        class="wheel"
        src="car/wheel-front.png"
        alt=""
      >

      <img
        id="carBody"
        src="car/car-body.png"
        alt="машинка"
      >

    </div>

  </div>

  <div id="touchControls">

    <button
      id="leftBtn"
      class="control-btn"
      type="button"
    >

      <div class="control-arrow">
        ◀
      </div>

      <div class="control-label">
        назад
      </div>

    </button>

    <button
      id="rightBtn"
      class="control-btn"
      type="button"
    >

      <div class="control-arrow">
        ▶
      </div>

      <div class="control-label">
        вперёд
      </div>

    </button>

  </div>

  <div id="fireworks"></div>

  <audio
    id="engineSound"
    src="sounds/engine.mp3"
    preload="auto"
    loop
  ></audio>

  <div
    id="startOverlay"
    class="overlay"
  >

    <div class="card">

      <h1>
        Звук Щ
      </h1>

      <div>
        Собери все картинки со звуком Щ.
      </div>

      <button
        id="startBtn"
        class="game-btn"
      >
        СТАРТ
      </button>

    </div>

  </div>

  <div
    id="finish"
    class="overlay"
  >

    <div class="card">

      <h1>
        🏁 Молодец!
      </h1>

      <div>
        Ты доехал до финиша!
      </div>

      <div>
        Собрано:
        <strong id="finishScore">25</strong>/25
      </div>

      <button
        id="restartBtn"
        class="game-btn"
      >
        Играть ещё
      </button>

    </div>

  </div>

</div>

<script>

const game =
document.getElementById("game");

const world =
document.getElementById("world");

const roadBackground =
document.getElementById("roadBackground");

const seamLayer =
document.getElementById("seamLayer");

const finishFlag =
document.getElementById("finishFlag");

const car =
document.getElementById("car");

const carInner =
document.getElementById("carInner");

const wheelFront =
document.getElementById("wheelFront");

const wheelBack =
document.getElementById("wheelBack");

const objectsLayer =
document.getElementById("objectsLayer");

const trafficLayer =
document.getElementById("trafficLayer");

const scoreElement =
document.getElementById("score");

const sectionElement =
document.getElementById("section");

const startOverlay =
document.getElementById("startOverlay");

const finish =
document.getElementById("finish");

const finishScore =
document.getElementById("finishScore");

const fireworks =
document.getElementById("fireworks");

const startBtn =
document.getElementById("startBtn");

const restartBtn =
document.getElementById("restartBtn");

const leftBtn =
document.getElementById("leftBtn");

const rightBtn =
document.getElementById("rightBtn");

const engineSound =
document.getElementById("engineSound");


const TOTAL_SECTIONS = 5;

let SECTION_WIDTH = 2025;

let WORLD_WIDTH =
SECTION_WIDTH *
TOTAL_SECTIONS;

let FINISH_X =
WORLD_WIDTH -
250;


const SPEED_X = 7;

const WHEEL_ROTATION_SPEED = 9;

let carWorldX = 110;

let carY = 66;

let cameraX = 0;

let score = 0;

let running = false;

let finished = false;

let wheelRotation = 0;


const keys = {
  ArrowLeft: false,
  ArrowRight: false
};


window.addEventListener(
"keydown",
event => {

  if (
    event.key in keys
  ) {

    event.preventDefault();

    keys[event.key] =
    true;

  }

});


window.addEventListener(
"keyup",
event => {

  if (
    event.key in keys
  ) {

    event.preventDefault();

    keys[event.key] =
    false;

  }

});


window.addEventListener(
"blur",
() => {

  keys.ArrowLeft = false;
  keys.ArrowRight = false;

  stopEngine();

});


function bindHoldButton(
button,
keyName
) {

  const press =
  event => {

    event.preventDefault();

    keys[keyName] =
    true;

    button.classList.add(
      "active"
    );

  };

  const release =
  event => {

    event.preventDefault();

    keys[keyName] =
    false;

    button.classList.remove(
      "active"
    );

  };

  button.addEventListener(
    "pointerdown",
    press
  );

  button.addEventListener(
    "pointerup",
    release
  );

  button.addEventListener(
    "pointerleave",
    release
  );

  button.addEventListener(
    "pointercancel",
    release
  );

}


bindHoldButton(
  leftBtn,
  "ArrowLeft"
);

bindHoldButton(
  rightBtn,
  "ArrowRight"
);


/* 25 КАРТИНОК */

const ALL_ITEMS = [];

for (
  let i = 1;
  i <= 25;
  i++
) {

  const number =

  String(i)
  .padStart(
    2,
    "0"
  );

  ALL_ITEMS.push(

    `items/sh/pik-${number}.png`

  );

}


let itemObjects = [];

let trafficLights = [];


/* ЗВУК МОТОРА */

function startEngine() {

  if (
    engineSound.paused
  ) {

    engineSound.volume =
    0.35;

    engineSound.play()
    .catch(
      () => {}
    );

  }

}


function stopEngine() {

  if (
    !engineSound.paused
  ) {

    engineSound.pause();

    engineSound.currentTime =
    0;

  }

}


function updateEngineSound() {

  if (
    !running
  ) {

    stopEngine();

    return;

  }

  const movingRight =

  keys.ArrowRight &&
  !keys.ArrowLeft &&
  canMoveForward();

  const movingLeft =

  keys.ArrowLeft &&
  !keys.ArrowRight;

  if (
    movingRight ||
    movingLeft
  ) {

    startEngine();

  }
  else {

    stopEngine();

  }

}


/* РАЗМЕР ФОНА */

function calculateWorldSize() {

  const bg =
  new Image();

  bg.src =
  "items/road-main.png";

  bg.onload =
  () => {

    const gameHeight =
    game.clientHeight;

    const ratio =

    bg.naturalWidth /
    bg.naturalHeight;

    SECTION_WIDTH =

    gameHeight *
    ratio;

    WORLD_WIDTH =

    SECTION_WIDTH *
    TOTAL_SECTIONS;

    FINISH_X =

    WORLD_WIDTH -
    250;

    world.style.width =
    WORLD_WIDTH +
    "px";

    roadBackground.style.width =
    WORLD_WIDTH +
    "px";

    seamLayer.style.width =
    WORLD_WIDTH +
    "px";

    finishFlag.style.left =
    FINISH_X +
    "px";

    createSeamClouds();

    createWorld();

    createTrafficLights();

    updateCamera();

  };

}


/* ОБЛАКА */

function createSeamClouds() {

  seamLayer.innerHTML =
  "";

  for (
    let i = 1;
    i < TOTAL_SECTIONS;
    i++
  ) {

    const cloudX =

    SECTION_WIDTH *
    i;

    const cloud =

    document.createElement(
      "img"
    );

    cloud.className =
    "seam-cloud";

    cloud.src =
    "items/cloud-seam.png";

    cloud.alt =
    "";

    cloud.style.left =
    cloudX +
    "px";

    cloud.style.top =
    "18%";

    seamLayer.appendChild(
      cloud
    );

  }

}


/* ПРЕДМЕТЫ */

function createWorld() {

  objectsLayer.innerHTML =
  "";

  itemObjects =
  [];

  const positions = [

    0.22,
    0.36,
    0.50,
    0.66,
    0.83

  ];

  const yPositions = [

    61,
    66,
    62,
    67,
    63

  ];

  for (
    let section = 0;
    section < 5;
    section++
  ) {

    const sectionStart =

    section *
    SECTION_WIDTH;

    for (
      let i = 0;
      i < 5;
      i++
    ) {

      const index =

      section *
      5 +
      i;

      const wrapper =

      document.createElement(
        "div"
      );

      wrapper.className =
      "item";

      const img =

      document.createElement(
        "img"
      );

      img.src =
      ALL_ITEMS[index];

      img.alt =
      `Предмет ${index + 1}`;

      wrapper.appendChild(
        img
      );

      const worldX =

      sectionStart +
      SECTION_WIDTH *
      positions[i];

      wrapper.style.left =
      worldX +
      "px";

      wrapper.style.top =
      yPositions[i] +
      "%";

      objectsLayer.appendChild(
        wrapper
      );

      itemObjects.push({

        element:
        wrapper,

        collected:
        false

      });

    }

  }

}


/* СВЕТОФОРЫ */

function createTrafficLights() {

  trafficLayer.innerHTML =
  "";

  trafficLights =
  [];

  for (
    let i = 1;
    i < 5;
    i++
  ) {

    const x =

    SECTION_WIDTH *
    i;

    const img =

    document.createElement(
      "img"
    );

    img.className =
    "traffic-light";

    img.src =
    "items/traffic-red.png";

    img.style.left =
    x +
    "px";

    img.style.top =
    "50%";

    const message =

    document.createElement(
      "div"
    );

    message.className =
    "traffic-message";

    message.textContent =
    "Нажми на светофор";

    message.style.left =
    x +
    "px";

    message.style.top =
    "31%";

    trafficLayer.appendChild(
      img
    );

    trafficLayer.appendChild(
      message
    );

    const traffic = {

      x: x,

      green: false,

      element: img,

      message: message

    };

    img.addEventListener(
    "click",
    () => {

      const distance =

      Math.abs(
        carWorldX -
        x
      );

      if (
        distance <
        400
      ) {

        traffic.green =
        true;

        img.src =
        "items/traffic-green.png";

        message
        .classList
        .remove(
          "show"
        );

        img
        .classList
        .remove(
          "ready"
        );

      }

    });

    trafficLights.push(
      traffic
    );

  }

}


function updateTrafficLights() {

  trafficLights.forEach(
  traffic => {

    if (
      traffic.green
    ) {

      traffic.element
      .classList
      .remove(
        "ready"
      );

      traffic.message
      .classList
      .remove(
        "show"
      );

      return;

    }

    const distance =

    traffic.x -
    carWorldX;

    if (
      distance >
      0
      &&
      distance <
      450
    ) {

      traffic.element
      .classList
      .add(
        "ready"
      );

      traffic.message
      .classList
      .add(
        "show"
      );

    }
    else {

      traffic.element
      .classList
      .remove(
        "ready"
      );

      traffic.message
      .classList
      .remove(
        "show"
      );

    }

  });

}


function canMoveForward() {

  for (
    const traffic of
    trafficLights
  ) {

    if (
      traffic.green
    ) {

      continue;

    }

    const stopX =

    traffic.x -
    145;

    if (
      carWorldX >=
      stopX
      &&
      carWorldX <=
      traffic.x
    ) {

      return false;

    }

  }

  return true;

}


/* КОЛЁСА */

function rotateWheels(
direction
) {

  wheelRotation +=

  WHEEL_ROTATION_SPEED *
  direction;

  wheelFront.style.transform =

  `rotate(${wheelRotation}deg)`;

  wheelBack.style.transform =

  `rotate(${wheelRotation}deg)`;

}


/* ДВИЖЕНИЕ */

function moveCar() {

  if (
    keys.ArrowRight
    &&
    !keys.ArrowLeft
  ) {

    if (
      canMoveForward()
    ) {

      carWorldX +=
      SPEED_X;

      rotateWheels(
        1
      );

    }

    carInner.style.transform =
    "scaleX(1)";

  }

  if (
    keys.ArrowLeft
    &&
    !keys.ArrowRight
  ) {

    carWorldX -=
    SPEED_X;

    rotateWheels(
      -1
    );

    carInner.style.transform =
    "scaleX(-1)";

  }

  carWorldX =

  Math.max(

    90,

    Math.min(

      WORLD_WIDTH -
      100,

      carWorldX

    )

  );

}


/* КАМЕРА */

function updateCamera() {

  const gameWidth =
  game.clientWidth;

  const screenX =

  gameWidth *
  .32;

  cameraX =

  carWorldX -
  screenX;

  cameraX =

  Math.max(

    0,

    Math.min(

      WORLD_WIDTH -
      gameWidth,

      cameraX

    )

  );

  world.style.transform =

  `translateX(${-cameraX}px)`;

  car.style.left =

  (
    carWorldX -
    cameraX
  )
  +
  "px";

  car.style.top =
  carY +
  "%";

}


/* УЧАСТОК */

function updateSection() {

  let section =

  Math.floor(

    carWorldX /
    SECTION_WIDTH

  )
  +
  1;

  section =

  Math.max(

    1,

    Math.min(

      5,

      section

    )

  );

  sectionElement.textContent =
  section;

}


/* СБОР */

function checkItems() {

  const carRect =

  car
  .getBoundingClientRect();

  itemObjects.forEach(
  item => {

    if (
      item.collected
    ) {

      return;

    }

    const itemRect =

    item.element
    .getBoundingClientRect();

    const hit = !(

      carRect.right <
      itemRect.left

      ||

      carRect.left >
      itemRect.right

      ||

      carRect.bottom <
      itemRect.top

      ||

      carRect.top >
      itemRect.bottom

    );

    if (
      hit
    ) {

      item.collected =
      true;

      item.element
      .classList
      .add(
        "collected"
      );

      score++;

      scoreElement.textContent =
      score;

    }

  });

}


/* САЛЮТ */

function createFirework(
x,
y
) {

  const colors = [

    "#ff3b30",
    "#ffcc00",
    "#34c759",
    "#007aff",
    "#af52de",
    "#ff9500"

  ];

  for (
    let i = 0;
    i < 24;
    i++
  ) {

    const p =

    document.createElement(
      "div"
    );

    p.className =
    "firework-particle";

    p.style.left =
    x +
    "px";

    p.style.top =
    y +
    "px";

    p.style.background =

    colors[
      Math.floor(
        Math.random() *
        colors.length
      )
    ];

    const angle =

    Math.random() *
    Math.PI *
    2;

    const distance =

    50 +
    Math.random() *
    100;

    p.style.setProperty(

      "--dx",

      Math.cos(angle) *
      distance +
      "px"

    );

    p.style.setProperty(

      "--dy",

      Math.sin(angle) *
      distance +
      "px"

    );

    fireworks.appendChild(
      p
    );

    setTimeout(
      () => {

        p.remove();

      },

      1000
    );

  }

}


function launchFireworks() {

  const w =
  game.clientWidth;

  const h =
  game.clientHeight;

  createFirework(
    w * .3,
    h * .3
  );

  setTimeout(
    () => {

      createFirework(
        w * .5,
        h * .2
      );

    },
    200
  );

  setTimeout(
    () => {

      createFirework(
        w * .7,
        h * .3
      );

    },
    400
  );

}


/* ФИНИШ */

function checkFinish() {

  if (
    finished
  ) {

    return;

  }

  if (
    carWorldX >=
    FINISH_X
  ) {

    finished =
    true;

    running =
    false;

    stopEngine();

    launchFireworks();

    setTimeout(
      () => {

        finishScore.textContent =
        score;

        finish.style.display =
        "flex";

      },

      900
    );

  }

}


/* ЦИКЛ */

function gameLoop() {

  if (
    running
  ) {

    moveCar();

    updateEngineSound();

    updateCamera();

    updateSection();

    updateTrafficLights();

    checkItems();

    checkFinish();

  }
  else {

    stopEngine();

  }

  requestAnimationFrame(
    gameLoop
  );

}


/* СТАРТ */

function startGame() {

  carWorldX =
  110;

  cameraX =
  0;

  score =
  0;

  finished =
  false;

  wheelRotation =
  0;

  keys.ArrowLeft =
  false;

  keys.ArrowRight =
  false;

  scoreElement.textContent =
  "0";

  sectionElement.textContent =
  "1";

  finish.style.display =
  "none";

  startOverlay.style.display =
  "none";

  fireworks.innerHTML =
  "";

  stopEngine();

  carInner.style.transform =
  "scaleX(1)";

  wheelFront.style.transform =
  "rotate(0deg)";

  wheelBack.style.transform =
  "rotate(0deg)";

  createSeamClouds();

  createWorld();

  createTrafficLights();

  updateCamera();

  running =
  true;

}


startBtn.addEventListener(
"click",
startGame
);

restartBtn.addEventListener(
"click",
startGame
);


calculateWorldSize();

updateCamera();

requestAnimationFrame(
gameLoop
);

window.addEventListener(
"resize",
() => {

  calculateWorldSize();

});

</script>

</body>
</html>

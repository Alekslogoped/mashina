<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бесконечная дорога</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #eef6ff;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game {
      position: relative;
      width: min(1200px, 100vw);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #98d985;
    }

    /* =========================
       НЕБО / ФОН
    ========================= */

    .sky {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          #bfeaff 0%,
          #bfeaff 45%,
          #8fd17c 45%,
          #8fd17c 100%
        );
      z-index: 0;
    }

    /* =========================
       ДОРОГА
    ========================= */

    #road {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 200%;
      height: 56%;
      z-index: 1;

      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 110px,
          rgba(255,255,255,0.95) 110px 170px,
          transparent 170px 280px
        ),
        #666;
    }

    #road::before,
    #road::after {
      content: "";
      position: absolute;
      left: 0;
      width: 100%;
      height: 12px;
      background: white;
    }

    #road::before {
      top: 0;
    }

    #road::after {
      bottom: 0;
    }

    /* =========================
       МАШИНКА
    ========================= */

    #car {
      position: absolute;
      left: 18%;
      top: 68%;
      transform: translate(-50%, -50%);
      z-index: 20;

      width: 120px;
      height: 100px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    #car span {
      font-size: 95px;
      line-height: 1;
      filter: drop-shadow(0 8px 5px rgba(0,0,0,0.25));
    }

    /* =========================
       ПРЕДМЕТЫ
    ========================= */

    .item {
      position: absolute;
      z-index: 10;

      width: 75px;
      height: 75px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 58px;

      transform: translate(-50%, -50%);

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .item.collected {
      opacity: 0;
      transform:
        translate(-50%, -50%)
        scale(1.8);
    }

    /* =========================
       ЗНАК
    ========================= */

    .road-sign {
      position: absolute;
      z-index: 12;

      width: 90px;
      height: 110px;

      transform: translate(-50%, -50%);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 76px;
    }

    /* =========================
       ПАНЕЛЬ
    ========================= */

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;

      display: flex;
      justify-content: space-between;

      z-index: 50;

      font-size: 20px;
      font-weight: 700;
    }

    .panel {
      background: rgba(255,255,255,0.9);
      padding: 9px 16px;
      border-radius: 20px;
    }

    /* =========================
       ПОДСКАЗКА
    ========================= */

    #hint {
      position: absolute;
      left: 50%;
      top: 70px;

      transform: translateX(-50%);

      background: rgba(255,255,255,0.9);

      padding: 8px 15px;
      border-radius: 25px;

      z-index: 50;

      font-weight: bold;
    }

    /* =========================
       СТАРТ / ФИНИШ
    ========================= */

    #overlay {
      position: absolute;
      inset: 0;

      z-index: 100;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(0,0,0,0.28);
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 30px 40px;
      text-align: center;

      box-shadow: 0 12px 35px rgba(0,0,0,.25);
    }

    .card h1 {
      margin: 0 0 10px;
    }

    button {
      margin-top: 15px;

      border: none;
      border-radius: 999px;

      padding: 14px 30px;

      background: #2f80ed;
      color: white;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;
    }

    #finish {
      display: none;
    }

  </style>
</head>

<body>

<div id="game">

  <div class="sky"></div>

  <div id="road"></div>

  <div id="hud">

    <div class="panel">
      Собрано:
      <span id="score">0</span>/25
    </div>

    <div class="panel">
      Участок:
      <span id="section">1</span>/5
    </div>

  </div>

  <div id="hint">
    Управляй: ↑ ↓ и → для движения
  </div>

  <div id="car">
    <span>🚗</span>
  </div>

  <div id="objectsLayer"></div>

  <!-- СТАРТ -->
  <div id="overlay">
    <div class="card">
      <h1>Поехали!</h1>
      <div>
        Собери все 25 предметов.
      </div>

      <button id="startBtn">
        СТАРТ
      </button>
    </div>
  </div>

  <!-- ФИНИШ -->
  <div id="finish">
    <div class="card">
      <h1>Молодец!</h1>
      <div>
        Ты собрал все предметы!
      </div>

      <button id="restartBtn">
        Играть ещё
      </button>
    </div>
  </div>

</div>


<script>

/* =========================
   ОСНОВНЫЕ ЭЛЕМЕНТЫ
========================= */

const game =
  document.getElementById("game");

const road =
  document.getElementById("road");

const car =
  document.getElementById("car");

const objectsLayer =
  document.getElementById("objectsLayer");

const scoreElement =
  document.getElementById("score");

const sectionElement =
  document.getElementById("section");

const overlay =
  document.getElementById("overlay");

const finish =
  document.getElementById("finish");

const startBtn =
  document.getElementById("startBtn");

const restartBtn =
  document.getElementById("restartBtn");


/* =========================
   НАСТРОЙКИ
========================= */

const TOTAL_SECTIONS = 5;

const ITEMS_PER_SECTION = 5;

const TOTAL_ITEMS =
  TOTAL_SECTIONS *
  ITEMS_PER_SECTION;


/*
Скорость прокрутки дороги
*/

const ROAD_SPEED = 5;


/*
Положение машины
*/

let carY = 68;


/*
Текущий участок
*/

let currentSection = 1;


/*
Сколько собрано
*/

let score = 0;


/*
Игра запущена?
*/

let running = false;


/*
Прокрутка разметки дороги
*/

let roadOffset = 0;


/*
Клавиши
*/

const keys = {
  ArrowUp: false,
  ArrowDown: false,
  ArrowRight: false
};


/* =========================
   ВСЕ 25 ПРЕДМЕТОВ
========================= */

/*
Сейчас emoji для проверки.

Позже заменим на PNG.
*/

const ALL_ITEMS = [

  "🍎","🍐","🍊","🍋","🍉",

  "⚽","🏀","🎾","🧸","🎈",

  "🚂","🚲","🚁","⛵","🚜",

  "🐱","🐶","🐭","🐰","🦊",

  "⭐","🌙","☀️","🌈","☁️"

];


/* =========================
   АКТИВНЫЕ ОБЪЕКТЫ
========================= */

let activeObjects = [];


/* =========================
   КЛАВИАТУРА
========================= */

window.addEventListener(
  "keydown",
  (event) => {

    if (event.key in keys) {

      event.preventDefault();

      keys[event.key] = true;

    }

  }
);


window.addEventListener(
  "keyup",
  (event) => {

    if (event.key in keys) {

      event.preventDefault();

      keys[event.key] = false;

    }

  }
);


/* =========================
   СОЗДАНИЕ УЧАСТКА
========================= */

function createSection(sectionNumber) {

  activeObjects = [];

  objectsLayer.innerHTML = "";

  const startIndex =
    (sectionNumber - 1)
    * ITEMS_PER_SECTION;


  /*
  Пять предметов распределяем
  по дороге
  */

  const positions = [

    { x: 42, y: 66 },

    { x: 65, y: 74 },

    { x: 88, y: 62 },

    { x: 112, y: 72 },

    { x: 137, y: 65 }

  ];


  for (
    let i = 0;
    i < ITEMS_PER_SECTION;
    i++
  ) {

    const element =
      document.createElement("div");


    element.className =
      "item";


    element.innerHTML =
      ALL_ITEMS[
        startIndex + i
      ];


    element.style.left =
      positions[i].x + "%";


    element.style.top =
      positions[i].y + "%";


    objectsLayer.appendChild(
      element
    );


    activeObjects.push({

      type: "item",

      element: element,

      x: positions[i].x,

      y: positions[i].y,

      collected: false

    });

  }


  /*
  После пятого предмета —
  дорожный знак
  */

  const sign =
    document.createElement(
      "div"
    );


  sign.className =
    "road-sign";


  sign.innerHTML =
    "🚧";


  sign.style.left =
    "158%";


  sign.style.top =
    "62%";


  objectsLayer.appendChild(
    sign
  );


  activeObjects.push({

    type: "sign",

    element: sign,

    x: 158,

    y: 62,

    passed: false

  });


  sectionElement.textContent =
    sectionNumber;

}


/* =========================
   ДВИЖЕНИЕ МАШИНЫ
========================= */

function moveCar() {

  if (
    keys.ArrowUp
  ) {

    carY -= 0.5;

  }


  if (
    keys.ArrowDown
  ) {

    carY += 0.5;

  }


  /*
  Ограничиваем машинку
  только областью дороги
  */

  carY =
    Math.max(
      52,
      Math.min(
        82,
        carY
      )
    );


  car.style.top =
    carY + "%";

}


/* =========================
   ДВИЖЕНИЕ ДОРОГИ
========================= */

function moveRoad() {

  /*
  Если ребёнок держит →
  дорога движется быстрее.
  Без → она чуть медленнее.
  */

  let speed =
    ROAD_SPEED;


  if (
    keys.ArrowRight
  ) {

    speed = 7;

  }


  roadOffset -= speed;


  road.style.backgroundPosition =
    roadOffset + "px 0";


  /*
  Все предметы двигаются
  справа налево
  */

  activeObjects.forEach(
    object => {

      object.x -=
        speed * 0.018;


      object.element.style.left =
        object.x + "%";

    }
  );

}


/* =========================
   СТОЛКНОВЕНИЕ
========================= */

function checkCollisions() {

  const carRect =
    car.getBoundingClientRect();


  activeObjects.forEach(
    object => {


      /* =====================
         ПРЕДМЕТ
      ===================== */

      if (
        object.type === "item"
      ) {


        if (
          object.collected
        ) {

          return;

        }


        const rect =
          object.element
            .getBoundingClientRect();


        const collision = !(

          carRect.right <
          rect.left

          ||

          carRect.left >
          rect.right

          ||

          carRect.bottom <
          rect.top

          ||

          carRect.top >
          rect.bottom

        );


        if (
          collision
        ) {


          object.collected =
            true;


          object.element
            .classList
            .add(
              "collected"
            );


          score++;


          scoreElement.textContent =
            score;

        }

      }


      /* =====================
         ЗНАК
      ===================== */

      if (
        object.type === "sign"
      ) {


        if (
          object.passed
        ) {

          return;

        }


        /*
        Когда знак прошёл
        левее машины
        */

        if (
          object.x < 15
        ) {


          object.passed =
            true;


          nextSection();

        }

      }

    }
  );

}


/* =========================
   СЛЕДУЮЩИЙ УЧАСТОК
========================= */

function nextSection() {


  if (
    currentSection <
    TOTAL_SECTIONS
  ) {


    currentSection++;


    createSection(
      currentSection
    );

  }

  else {


    /*
    Пятый участок закончен
    */

    if (
      score >= TOTAL_ITEMS
    ) {

      endGame();

    }

    else {


      /*
      Даже если ребёнок
      пропустил какие-то предметы,
      пока просто завершаем.
      Позже можем сделать возврат.
      */

      endGame();

    }

  }

}


/* =========================
   ФИНИШ
========================= */

function endGame() {

  running = false;


  finish.style.display =
    "flex";


  finish.style.position =
    "absolute";


  finish.style.inset =
    "0";


  finish.style.zIndex =
    "100";


  finish.style.justifyContent =
    "center";


  finish.style.alignItems =
    "center";


  finish.style.background =
    "rgba(0,0,0,.3)";

}


/* =========================
   ИГРОВОЙ ЦИКЛ
========================= */

function loop() {

  if (
    running
  ) {

    moveCar();

    moveRoad();

    checkCollisions();

  }


  requestAnimationFrame(
    loop
  );

}


/* =========================
   СТАРТ
========================= */

function startGame() {

  score = 0;

  currentSection = 1;

  carY = 68;

  roadOffset = 0;


  scoreElement.textContent =
    "0";


  sectionElement.textContent =
    "1";


  finish.style.display =
    "none";


  overlay.style.display =
    "none";


  createSection(1);


  running = true;

}


/* =========================
   КНОПКИ
========================= */

startBtn.addEventListener(
  "click",
  startGame
);


restartBtn.addEventListener(
  "click",
  startGame
);


/* =========================
   ЗАПУСК ЦИКЛА
========================= */

requestAnimationFrame(
  loop
);

</script>

</body>
</html>
